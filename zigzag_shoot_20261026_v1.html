<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>商品撮影</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--line:#ddd8ce;--text:#24231f;--sub:#6d6a62;--main:#176b54;--main-dark:#0f503e;--soft:#e8f2ee;--warn:#9a5c00;--danger:#b12b26}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
.status{position:sticky;top:0;z-index:20;width:100%;min-height:46px;padding:12px 14px;background:#203b34;color:#fff;text-align:center;font-size:14px;font-weight:700;padding-top:calc(12px + env(safe-area-inset-top))}
.status.warn{background:#765019}.status.bad{background:#8a2925}
main{width:100%;max-width:560px;margin:0 auto;padding:12px}
.intro{margin-bottom:12px;padding:12px 14px;border:1px solid #c9d9d2;border-radius:14px;background:#f2f8f5;font-size:14px}
.intro p{margin:2px 0}
.card{margin-bottom:12px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 2px 10px rgba(42,38,29,.04)}
.card h1,.card h2{margin:0;overflow-wrap:anywhere}
.card h1{font-size:23px;line-height:1.35}.card h2{font-size:17px}
.hint{margin:6px 0 0;color:var(--sub);font-size:13px}
.step{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:var(--sub);font-size:13px;font-weight:700}
.step span{display:grid;width:27px;height:27px;place-items:center;border-radius:50%;background:var(--soft);color:var(--main)}
.photo-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.photo-row::-webkit-scrollbar{display:none}
.thumb{position:relative;flex:0 0 92px;height:92px;border-radius:12px;overflow:hidden;background:#ece9e2}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;right:4px;width:32px;height:32px;border:0;border-radius:50%;background:rgba(0,0,0,.72);color:#fff;font-size:20px;line-height:1}
.name-label{display:block;font-size:13px;color:var(--sub);margin-top:4px}.name-edit{width:100%;box-sizing:border-box;font-size:19px;font-weight:700;line-height:1.4;padding:8px;border:1px solid var(--line);border-radius:8px;resize:vertical;background:var(--card);color:var(--text)}
.text-link{display:inline-flex;min-height:44px;align-items:center;border:0;background:none;padding:4px 0;color:var(--main);text-decoration:underline;font-size:14px}
.loading{margin:10px 0;color:var(--sub);font-size:14px}
.choices{display:grid;gap:8px;margin-top:12px}
.choice{width:100%;min-height:54px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;overflow-wrap:anywhere}
.choice .done{display:block;margin-top:4px;font-size:13px;font-weight:400;color:#8a5a00}
.choice.on{border:2px solid var(--main);background:var(--soft);font-weight:700}
.condition{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.condition button{min-height:50px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;padding:10px 12px}
.condition button.on{border:2px solid var(--main);background:var(--soft);font-weight:700}
.quantity{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.counter{display:flex;align-items:center;gap:14px}.counter button{width:48px;height:48px;border:1px solid var(--line);border-radius:50%;background:#fff;font-size:24px}.counter output{min-width:28px;text-align:center;font-size:21px;font-weight:700}
details{margin-top:16px;border-top:1px solid var(--line);padding-top:8px}summary{min-height:44px;padding:11px 0;color:var(--main);font-weight:700;cursor:pointer}
label{display:block;margin:12px 0 4px;font-size:13px;font-weight:700;color:var(--sub)}
input[type=text],textarea{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
textarea{min-height:90px;resize:vertical}.count{text-align:right;color:var(--sub);font-size:12px}
.primary-wrap{position:fixed;right:0;bottom:0;left:0;z-index:15;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(245,243,238,.96) 18%,var(--bg) 38%)}
.primary{display:block;width:100%;max-width:536px;min-height:60px;margin:0 auto;border:0;border-radius:14px;background:var(--main);color:#fff;font-size:18px;font-weight:800;box-shadow:0 5px 16px rgba(23,107,84,.22)}
.primary:active{background:var(--main-dark)}.primary:disabled{background:#a5aaa6;box-shadow:none}
.receipt{text-align:center;padding:28px 16px}.management{margin:16px 0 4px;color:var(--main);font-size:42px;font-weight:900;letter-spacing:.05em;overflow-wrap:anywhere}.receipt p{margin:0;font-weight:700}
.error{margin:10px 0 0;color:var(--danger);font-size:14px;font-weight:700}
.scan-layer{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#0d1411;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.scan-layer[hidden]{display:none}.scan-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.scan-head h2{margin:0;font-size:18px}.scan-head button{min-width:44px;min-height:44px;border:0;background:none;color:#fff;text-decoration:underline}
#reader-wrap[hidden],#scan-tip[hidden]{display:none}#reader-wrap{position:relative;flex:1;min-height:160px;overflow:hidden;border-radius:14px;background:#000;margin-top:12px}#scan-video{display:block;width:100%;height:100%;object-fit:cover}.scan-guide{position:absolute;left:5%;right:5%;top:32%;height:36%;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}.scan-layer p{text-align:center;font-size:14px}
.scan-link{min-height:44px;border:0;background:none;color:#fff;text-decoration:underline;font-size:15px}.manual{display:grid;gap:8px}.manual[hidden]{display:none}.prefix{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.prefix button{min-height:44px;border:1px solid #6d7c76;border-radius:10px;background:transparent;color:#fff;font-size:15px}.prefix button.on{border:2px solid #fff;background:#2c4a41;font-weight:700}.manual input{display:block;width:100%;box-sizing:border-box;padding:12px;border:0;border-radius:10px;font-size:20px;letter-spacing:.05em}.manual-error{margin:0;color:#ffb4ac;font-size:14px}.manual-go{min-height:52px;border:0;border-radius:12px;background:#fff;color:#14231e;font-size:17px;font-weight:800}
.label-no{margin:6px 0 2px;font-size:28px;font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.scan-tools{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:10px;align-items:center}.scan-tools[hidden]{display:none}.scan-tools button{width:48px;height:48px;border:0;border-radius:10px;background:rgba(0,0,0,.5);color:#fff;font-size:15px;font-weight:700}.scan-tools button.on{background:#f5c542;color:#222}.scan-tools input{flex:1;height:40px}
.scan-shot{min-height:48px;border:1px solid #6d7c76;border-radius:12px;background:transparent;color:#fff;font-size:15px;font-weight:700}.scan-shot[hidden]{display:none}
.scan-result{display:grid;gap:10px;margin-top:12px;text-align:center}.scan-result[hidden]{display:none}.scan-result .read-no{padding:14px 8px;border-radius:12px;background:#e8f0e9;color:#14231e;font-size:30px;font-weight:800;letter-spacing:.05em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.check{display:flex;align-items:center;gap:10px;min-height:48px;margin:12px 0 0;font-size:15px;font-weight:700;color:var(--text)}.check input{width:24px;height:24px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:500px){.condition{grid-template-columns:1fr 1fr 1fr}.condition button{text-align:center}}
</style>
</head>
<body>
<div id="status" class="status" role="status" aria-live="polite">準備しています</div>
<main>
  <section id="intro" class="intro" hidden>
    <p>1. 袋のラベルを読みます</p>
    <p>2. 正面と、裏かタグを撮ります</p>
    <p>3. 商品と状態を選んで登録します</p>
  </section>
  <div id="app"></div>
</main>
<div class="primary-wrap"><button id="primary" class="primary" type="button">袋のラベルを読む</button></div>
<input id="photo-input" class="sr-only" type="file" accept="image/*" capture="environment">
<section id="scan-layer" class="scan-layer" hidden aria-modal="true" role="dialog" aria-label="袋のラベルを読む">
  <div class="scan-head"><h2>袋のラベルを枠に入れてください</h2><button id="scan-close" type="button">閉じる</button></div>
  <div id="reader-wrap"><video id="scan-video" playsinline muted autoplay></video><div class="scan-guide"></div><div id="scan-tools" class="scan-tools" hidden><button id="scan-torch" type="button" aria-label="ライト" hidden>ライト</button><input id="scan-zoom" type="range" aria-label="ズーム" hidden></div></div>
  <p id="scan-tip">明るい場所で、ラベル全体を枠に入れてください</p>
  <div id="scan-result" class="scan-result" hidden>
    <p>読み取った番号</p>
    <div id="read-no" class="read-no"></div>
    <p>袋のラベルと同じ番号か確かめてください</p>
    <button id="read-ok" class="manual-go" type="button">この番号で進む</button>
    <button id="read-again" class="scan-link" type="button">読み直す</button>
  </div>
  <button id="scan-shot" class="scan-shot" type="button">撮影して読み取る</button>
  <input id="scan-shot-input" class="sr-only" type="file" accept="image/*" capture="environment">
  <button id="manual-open" class="scan-link" type="button">読めないときは番号を入力</button>
  <form id="manual-form" class="manual" hidden novalidate>
    <div class="prefix" role="group" aria-label="番号の種類"><button type="button" data-prefix="PKGI" class="on">PKGI</button><button type="button" data-prefix="BU">BU</button><button type="button" data-prefix="PKG">PKG</button><button type="button" data-prefix="other">その他</button></div>
    <input id="manual-no" type="text" inputmode="numeric" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="ラベルの数字" aria-label="ラベルの番号">
    <p id="manual-error" class="manual-error" role="alert"></p>
    <button type="submit" class="manual-go">この番号で進む</button>
  </form>
</section>
<script src="vendor/barcode-detector_3.2.2/ponyfill.js"></script>
<script>
'use strict';
var API='https://pqfsanwopptslgdrdebn.supabase.co/functions/v1/zigzag-shoot';
var MAX_PHOTOS=8;
var DB_NAME='zigzag_shoot_v1';
var DB_STORE='pending';
var _cam=null;
var _detectorP=null;
var _readCode='';
// 読み取りはマクサスのダッシュボード (app/_components/BarcodeScanner.js) と同じ方式にそろえる
var SCAN_FORMATS=['code_128','code_39','code_93','ean_13','ean_8','itf','codabar','qr_code'];
var _manualPrefix='PKGI';
var _labelSeq=0; var _draftSeq=0;
var _flushing=false;
var _candidatesReady=Promise.resolve();
var state={stage:'label',photos:[],candidates:[],visibleCandidates:[],selected:null,selectedSet:false,condition:'',quantity:1,draft:{name:'',description:'',genre:''},size:'',memo:'',whiteout:false,draftBusy:false,draftDone:false,draftCandidate:null,nameEdited:false,aiUnavailable:false,label:'',error:'',managementNo:'',clientId:''};
var params=new URLSearchParams(location.search);
var worker=params.get('w')||'';
var mock=isMockMode(location.search);
var workerValid=mock||/^[A-Za-z0-9]{8}$/.test(worker);

function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function normCode(s){
  s=String(s).toUpperCase().replace(/\s+/g,'');
  var m=s.match(/^(BU|PKGI|PKG)-?(\d+)$/);
  if(!m)return s;
  var d=m[2];while(d.length<8)d='0'+d;
  return m[1]+'-'+d;
}
function findCode(items,raw){
  var code=normCode(raw),by=function(col){return items.filter(function(it){return it[col]===code;});};
  var box=by('箱'),one=box.length?[]:by('PKGI');
  return {code:code,box:box,one:one,bag:(box.length||one.length)?[]:by('袋')};
}
function isMockMode(search){return new URLSearchParams(search).get('mock')==='1';}
function photoRule(count){return {enough:count>=2,full:count>=8,remaining:Math.max(0,8-count)};}
function primaryState(value){
  if(value.stage==='receipt')return {action:'next',label:'次の商品へ',enabled:true};
  if(value.stage==='label')return {action:'scan',label:'袋のラベルを読む',enabled:value.workerValid!==false};
  if(value.photos<2)return {action:'photo',label:'写真を撮る（あと'+(2-value.photos)+'枚）',enabled:true};
  if(!value.ready&&value.waiting)return {action:'save',label:value.waiting,enabled:false};
  return {action:'save',label:'登録して次へ',enabled:!!value.ready};
}
function publicText(value){
  return String(value||'')
    .replace(/PKGI[-_ ]?[A-Za-z0-9-]*/gi,'')
    .replace(/\bIT[-_ ]?[A-Za-z0-9-]*/gi,'')
    .replace(/(?:価格|仕入値?|販売価格)/g,'')
    .replace(/[¥￥]\s*[\d,]+|[\d,]+\s*円/g,'')
    .replace(/\s{2,}/g,' ').trim();
}
function orderedCandidates(candidates,topIds,max){var ids=Array.isArray(topIds)?topIds:[];var picked=ids.map(function(id){return candidates.find(function(item){return item.candidate_id===id;});}).filter(Boolean);var picked2=picked.filter(function(item,i){return picked.indexOf(item)===i;});if(!picked2.length)return candidates.slice(0,max);return picked2.slice(0,max);}
function doneText(item){var done=Number(item&&item.done)||0,left=Number(item&&item.remaining)||0;if(done<=0)return '';if(left>0&&done>=left)return '残数ぶん登録済み';return '登録済み '+done+'点';}
function candidateViewNames(candidates,max){return candidates.slice(0,max).map(function(item){return publicText(item.name);});}
function dedupeQueue(items){
  var seen={},out=[];
  items.forEach(function(item){if(!item||!item.client_id)return;if(seen[item.client_id]===undefined){seen[item.client_id]=out.length;out.push(item);}else out[seen[item.client_id]]=item;});
  return out;
}
async function flushQueueList(items,send){
  var queue=dedupeQueue(items),remaining=[];
  for(var i=0;i<queue.length;i++){
    try{await send(queue[i]);}catch(error){remaining=remaining.concat(queue.slice(i));break;}
  }
  return remaining;
}
function makeUuid(){
  if(crypto.randomUUID)return crypto.randomUUID();
  var bytes=new Uint8Array(16);crypto.getRandomValues(bytes);bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;
  return Array.from(bytes,function(b){return b.toString(16).padStart(2,'0');}).join('').replace(/^(........)(....)(....)(....)/,'$1-$2-$3-$4-');
}
function safeStorageGet(key,fallback){try{var value=localStorage.getItem(key);return value===null?fallback:value;}catch(error){return fallback;}}
function safeStorageSet(key,value){try{localStorage.setItem(key,value);}catch(error){}}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayCount(){var raw=safeStorageGet('zigzag_shoot_today','');try{var value=JSON.parse(raw);return value&&value.date===todayKey()?Number(value.count)||0:0;}catch(error){return 0;}}
function addToday(){var next=todayCount()+1;safeStorageSet('zigzag_shoot_today',JSON.stringify({date:todayKey(),count:next}));return next;}
function showIntro(){if(safeStorageGet('zigzag_shoot_intro','')==='1')return;document.getElementById('intro').hidden=false;safeStorageSet('zigzag_shoot_intro','1');}

function mockCandidates(){return [
  {candidate_id:'11111111-1111-4111-8111-111111111111',name:'ネイビーのショルダーバッグ',remaining:1},
  {candidate_id:'22222222-2222-4222-8222-222222222222',name:'キャンバストートバッグ',remaining:2,done:1},
  {candidate_id:'33333333-3333-4333-8333-333333333333',name:'小さなポーチ',remaining:1}
];}
async function request(path,options){
  if(mock){
    await new Promise(function(resolve){setTimeout(resolve,180);});
    if(!options)return {candidates:mockCandidates()};
    var body=JSON.parse(options.body||'{}');
    if(body.action==='draft'){
      if(params.get('ai')==='0'){var unavailable=new Error('ai_unavailable');unavailable.status=503;throw unavailable;}
      if(body.candidate_id||body.prev_name){var picked=mockCandidates().find(function(item){return item.candidate_id===body.candidate_id;});return {name:(picked?picked.name:'ネイビー ショルダーバッグ')+' 作り直し',description:'作り直した説明です。',genre:'バッグ',candidate_id:body.candidate_id||null,confidence:body.candidate_id?1:.5,top_ids:[]};}
      return {name:'ネイビーのショルダーバッグ',description:'落ち着いた色のバッグです。写真の状態をご確認ください。',genre:'バッグ',candidate_id:mockCandidates()[0].candidate_id,confidence:.94};
    }
    if(body.action==='save')return {ok:true,management_no:'Z00123',photo_urls:[]};
  }
  var response=await fetch(API+path,options);
  var value={};try{value=await response.json();}catch(error){}
  if(!response.ok){var requestError=new Error(value.error||'request_failed');requestError.status=response.status;throw requestError;}
  return value;
}
// 保存を送る。窓口がまだ番号と白抜きの項目を知らない版なら、その2つを外して送り直す（公開の順番がずれても登録を止めない）
function withoutNewFields(body){var copy={};Object.keys(body).forEach(function(key){if(key!=='label'&&key!=='whiteout')copy[key]=body[key];});return copy;}
async function sendSave(body){
  try{return await request('',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});}
  catch(error){
    if(error.status===400&&error.message==='unknown_field'&&('label' in body||'whiteout' in body))return request('',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(withoutNewFields(body))});
    throw error;
  }
}
function openQueue(){
  return new Promise(function(resolve,reject){
    var call=indexedDB.open(DB_NAME,1);
    call.onupgradeneeded=function(){var db=call.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE,{keyPath:'client_id'});};
    call.onsuccess=function(){resolve(call.result);};call.onerror=function(){reject(call.error);};
  });
}
async function queuePut(body){var db=await openQueue();await new Promise(function(resolve,reject){var tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(body);tx.oncomplete=resolve;tx.onerror=function(){reject(tx.error);};});db.close();}
async function queueAll(){var db=await openQueue();var rows=await new Promise(function(resolve,reject){var call=db.transaction(DB_STORE).objectStore(DB_STORE).getAll();call.onsuccess=function(){resolve(call.result||[]);};call.onerror=function(){reject(call.error);};});db.close();return dedupeQueue(rows);}
async function queueDelete(id){var db=await openQueue();await new Promise(function(resolve,reject){var tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=function(){reject(tx.error);};});db.close();}
async function queueCount(){try{return (await queueAll()).length;}catch(error){return 0;}}
async function flushQueue(){
  if(_flushing||navigator.onLine===false||!workerValid)return;
  _flushing=true;
  try{
    var rows=await queueAll();
    await flushQueueList(rows,async function(body){var result=await sendSave(body);await queueDelete(body.client_id);if(state.stage==='receipt'&&state.clientId===body.client_id){state.managementNo=result.management_no||'';render();}});
  }catch(error){}finally{_flushing=false;await updateStatus();}
}
async function updateStatus(){
  var status=document.getElementById('status');
  if(!workerValid){status.className='status bad';status.textContent='この URL は使えません。担当者に連絡してください';return;}
  var pending=await queueCount();
  if(pending){status.className='status warn';status.textContent='未送信 '+pending+'件 ・ つながったら自動で送ります';return;}
  status.className='status';status.textContent='今日 '+todayCount()+'件登録 ・ 保存済み ✓';
}
function resetItem(){_draftSeq++;_labelSeq++;state={stage:'label',photos:[],candidates:[],visibleCandidates:[],selected:null,selectedSet:false,condition:'',quantity:1,draft:{name:'',description:'',genre:''},size:'',memo:'',whiteout:false,draftBusy:false,draftDone:false,draftCandidate:null,nameEdited:false,aiUnavailable:false,label:'',error:'',managementNo:'',clientId:''};render();}
function readyToSave(){return state.photos.length>=2&&state.draftDone&&!state.draftBusy&&state.selectedSet&&!!state.condition;}
function waitingText(){if(state.draftBusy||!state.draftDone)return '商品名を確認しています';if(!state.selectedSet)return '商品を選んでください';if(!state.condition)return '商品の状態を選んでください';return '';}
function primaryInfo(){return primaryState({stage:state.stage,photos:state.photos.length,ready:readyToSave(),waiting:waitingText(),workerValid:workerValid});}
function candidateHtml(){
  if(!state.draftDone)return '';
  var title=state.aiUnavailable?'商品を選んでください':'写真に合う商品を選んでください';

document.getElementById('app').addEventListener('input',function(event){
  if(event.target.id==='edit-name'){state.draft.name=event.target.value;state.nameEdited=true;}
  else if(event.target.id==='edit-description')state.draft.description=event.target.value;
  else if(event.target.id==='edit-size')state.size=event.target.value;
  else if(event.target.id==='edit-memo'){state.memo=event.target.value;var count=document.getElementById('memo-count');if(count)count.textContent=event.target.value.length+' / 500';}
});
document.getElementById('app').addEventListener('change',function(event){if(event.target.id==='edit-whiteout')state.whiteout=!!event.target.checked;});
document.getElementById('read-ok').addEventListener('click',function(){var code=_readCode;if(!code)return;closeScan();loadLabel(code);});
document.getElementById('read-again').addEventListener('click',function(){openScan();});
document.getElementById('scan-shot').addEventListener('click',function(){document.getElementById('scan-shot-input').click();});
document.getElementById('scan-shot-input').addEventListener('change',async function(){
  var file=this.files&&this.files[0];this.value='';if(!file)return;
  var tip=document.getElementById('scan-tip'),button=document.getElementById('scan-shot');button.disabled=true;tip.textContent='写真から番号を読んでいます';
  try{var text=await decodeStill(file);if(text){showRead(text);return;}tip.textContent='読み取れませんでした。ラベルを画面いっぱいに写して撮り直すか、番号を入力してください';}
  catch(error){tip.textContent='読み取れませんでした。番号を入力してください';}
  finally{button.disabled=false;}
});
document.getElementById('scan-torch').addEventListener('click',async function(){var cam=_cam;if(!cam||!cam.track)return;try{await cam.track.applyConstraints({advanced:[{torch:!cam.torch}]});cam.torch=!cam.torch;this.classList.toggle('on',cam.torch);}catch(error){}});
document.getElementById('scan-zoom').addEventListener('input',async function(){var cam=_cam;if(!cam||!cam.track)return;try{await cam.track.applyConstraints({advanced:[{zoom:parseFloat(this.value)}]});}catch(error){}});
window.addEventListener('online',flushQueue);
showIntro();render();updateStatus().then(flushQueue);
</script>
</body>
</html>

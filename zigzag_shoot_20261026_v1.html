<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>商品撮影</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--line:#ddd8ce;--text:#24231f;--sub:#6d6a62;--main:#176b54;--main-dark:#0f503e;--soft:#e8f2ee;--warn:#9a5c00;--danger:#b12b26}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
.status{position:sticky;top:0;z-index:20;width:100%;min-height:46px;padding:12px 14px;background:#203b34;color:#fff;text-align:center;font-size:14px;font-weight:700;padding-top:calc(12px + env(safe-area-inset-top))}
.status.warn{background:#765019}.status.bad{background:#8a2925}
main{width:100%;max-width:560px;margin:0 auto;padding:12px}
.intro{margin-bottom:12px;padding:12px 14px;border:1px solid #c9d9d2;border-radius:14px;background:#f2f8f5;font-size:14px}
.intro p{margin:2px 0}
.card{margin-bottom:12px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 2px 10px rgba(42,38,29,.04)}
.card h1,.card h2{margin:0;overflow-wrap:anywhere}
.card h1{font-size:23px;line-height:1.35}.card h2{font-size:17px}
.hint{margin:6px 0 0;color:var(--sub);font-size:13px}
.step{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:var(--sub);font-size:13px;font-weight:700}
.step span{display:grid;width:27px;height:27px;place-items:center;border-radius:50%;background:var(--soft);color:var(--main)}
.photo-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.photo-row::-webkit-scrollbar{display:none}
.thumb{position:relative;flex:0 0 auto;min-width:69px;height:92px;border-radius:12px;overflow:hidden;background:#ece9e2}
.thumb img{display:block;width:auto;height:100%}
.shape{display:inline-flex;margin:0 0 10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.shape button{min-width:64px;min-height:40px;border:0;background:#fff;color:#14231e;font-size:15px}.shape button.on{background:var(--main);color:#fff;font-weight:700}
.links{display:flex;flex-wrap:wrap;gap:4px 20px}
.mine-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.mine-row img,.mine-row .noimg{flex:0 0 56px;width:56px;height:56px;border-radius:10px;object-fit:cover;background:#ece9e2}.mine-row .body{flex:1;min-width:0}.mine-row .no{font-weight:800}.mine-row .nm{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mine-row .tag{font-size:13px;color:var(--sub);white-space:nowrap}.mine-row .nm.wrap{white-space:normal}.mine-row .acts{display:flex;gap:6px}.fix{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);font-size:14px;white-space:nowrap}.edit-box{padding:4px 0 14px}.edit-box .text-link{margin-top:10px}.mine-row .cancel{min-height:44px;padding:0 12px;border:1px solid var(--danger);border-radius:10px;background:#fff;color:var(--danger);font-size:14px;white-space:nowrap}
.receipt.cancelled .management{color:var(--sub);text-decoration:line-through}
.thumb button{position:absolute;top:4px;right:4px;width:32px;height:32px;border:0;border-radius:50%;background:rgba(0,0,0,.72);color:#fff;font-size:20px;line-height:1}
.name-label{display:block;font-size:13px;color:var(--sub);margin-top:4px}.name-edit{width:100%;box-sizing:border-box;font-size:19px;font-weight:700;line-height:1.4;padding:8px;border:1px solid var(--line);border-radius:8px;resize:vertical;background:var(--card);color:var(--text)}
.text-link{display:inline-flex;min-height:44px;align-items:center;border:0;background:none;padding:4px 0;color:var(--main);text-decoration:underline;font-size:14px}
.loading{margin:10px 0;color:var(--sub);font-size:14px}
.choices{display:grid;gap:8px;margin-top:12px}
.choice{width:100%;min-height:54px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;overflow-wrap:anywhere}
.choice .done{display:block;margin-top:4px;font-size:13px;font-weight:400;color:#8a5a00}
.choice.on{border:2px solid var(--main);background:var(--soft);font-weight:700}
.condition{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.condition button{min-height:50px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;padding:10px 12px}
.condition button.on{border:2px solid var(--main);background:var(--soft);font-weight:700}
.quantity{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.counter{display:flex;align-items:center;gap:14px}.counter button{width:48px;height:48px;border:1px solid var(--line);border-radius:50%;background:#fff;font-size:24px}.counter output{min-width:28px;text-align:center;font-size:21px;font-weight:700}
details{margin-top:16px;border-top:1px solid var(--line);padding-top:8px}summary{min-height:44px;padding:11px 0;color:var(--main);font-weight:700;cursor:pointer}
label{display:block;margin:12px 0 4px;font-size:13px;font-weight:700;color:var(--sub)}
input[type=text],textarea{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
textarea{min-height:90px;resize:vertical}.count{text-align:right;color:var(--sub);font-size:12px}
.primary-wrap{position:fixed;right:0;bottom:0;left:0;z-index:15;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(245,243,238,.96) 18%,var(--bg) 38%)}
.primary{display:block;width:100%;max-width:536px;min-height:60px;margin:0 auto;border:0;border-radius:14px;background:var(--main);color:#fff;font-size:18px;font-weight:800;box-shadow:0 5px 16px rgba(23,107,84,.22)}
.primary:active{background:var(--main-dark)}.primary:disabled{background:#a5aaa6;box-shadow:none}
.receipt{text-align:center;padding:28px 16px}.management{margin:16px 0 4px;color:var(--main);font-size:42px;font-weight:900;letter-spacing:.05em;overflow-wrap:anywhere}.receipt p{margin:0;font-weight:700}
.error{margin:10px 0 0;color:var(--danger);font-size:14px;font-weight:700}
.scan-layer{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#0d1411;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.scan-layer[hidden]{display:none}.scan-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.scan-head h2{margin:0;font-size:18px}.scan-head button{min-width:44px;min-height:44px;border:0;background:none;color:#fff;text-decoration:underline}
#reader-wrap[hidden],#scan-tip[hidden]{display:none}#reader-wrap{position:relative;flex:1;min-height:160px;overflow:hidden;border-radius:14px;background:#000;margin-top:12px}#scan-video{display:block;width:100%;height:100%;object-fit:cover}.scan-guide{position:absolute;left:5%;right:5%;top:32%;height:36%;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}.scan-layer p{text-align:center;font-size:14px}
.scan-link{min-height:44px;border:0;background:none;color:#fff;text-decoration:underline;font-size:15px}.manual{display:grid;gap:8px}.manual[hidden]{display:none}.prefix{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.prefix button{min-height:44px;border:1px solid #6d7c76;border-radius:10px;background:transparent;color:#fff;font-size:15px}.prefix button.on{border:2px solid #fff;background:#2c4a41;font-weight:700}.manual input{display:block;width:100%;box-sizing:border-box;padding:12px;border:0;border-radius:10px;background:#fff;color:#14231e;-webkit-text-fill-color:#14231e;font-size:20px;letter-spacing:.05em}.manual-error{margin:0;color:#ffb4ac;font-size:14px}.manual-go{min-height:52px;border:0;border-radius:12px;background:#fff;color:#14231e;font-size:17px;font-weight:800}
.label-no{margin:6px 0 2px;font-size:28px;font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.scan-tools{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:10px;align-items:center}.scan-tools[hidden]{display:none}.scan-tools button{width:48px;height:48px;border:0;border-radius:10px;background:rgba(0,0,0,.5);color:#fff;font-size:15px;font-weight:700}.scan-tools button.on{background:#f5c542;color:#222}.scan-tools input{flex:1;height:40px}
.scan-shot{min-height:48px;border:1px solid #6d7c76;border-radius:12px;background:transparent;color:#fff;font-size:15px;font-weight:700}.scan-shot[hidden]{display:none}
.scan-result{display:grid;gap:10px;margin-top:12px;text-align:center}.scan-result[hidden]{display:none}.scan-result .read-no{padding:14px 8px;border-radius:12px;background:#e8f0e9;color:#14231e;font-size:30px;font-weight:800;letter-spacing:.05em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.check{display:flex;align-items:center;gap:10px;min-height:48px;margin:12px 0 0;font-size:15px;font-weight:700;color:var(--text)}.check input{width:24px;height:24px}
.cam-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin-top:12px}#cam-box{position:relative;overflow:hidden;width:300px;height:300px;border:2px solid #fff;border-radius:6px;background:#000}#cam-video{display:block;width:100%;height:100%;object-fit:cover}.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}.cam-flash.on{opacity:.7;transition:none}
.cam-bar{display:flex;flex-direction:column;align-items:center;gap:10px}.cam-shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:#fff;box-shadow:inset 0 0 0 3px #0d1411;color:#14231e;font-size:16px;font-weight:800}.cam-shutter.wide{width:auto;height:52px;padding:0 24px;border-radius:12px;box-shadow:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:500px){.condition{grid-template-columns:1fr 1fr 1fr}.condition button{text-align:center}}
</style>
</head>
<body>
<div id="status" class="status" role="status" aria-live="polite">準備しています</div>
<main>
  <section id="intro" class="intro" hidden>
    <p>1. 袋のラベルを読みます</p>
    <p>2. 正面と、裏かタグを撮ります</p>
    <p>3. 商品と状態を選んで登録します</p>
  </section>
  <div id="app"></div>
</main>
<div class="primary-wrap"><button id="primary" class="primary" type="button">袋のラベルを読む</button></div>
<input id="photo-input" class="sr-only" type="file" accept="image/*" capture="environment">
<input id="pick-input" class="sr-only" type="file" accept="image/*" multiple>
<section id="cam-layer" class="scan-layer" hidden aria-modal="true" role="dialog" aria-label="商品を撮る">
  <div class="scan-head"><h2 id="cam-title">正面を撮ってください</h2><button id="cam-close" type="button">閉じる</button></div>
  <div id="cam-wrap" class="cam-wrap"><div id="cam-box"><video id="cam-video" playsinline muted autoplay></video><div id="cam-flash" class="cam-flash"></div></div></div>
  <p id="cam-tip">枠の中が写真になります</p>
  <div class="cam-bar"><div class="shape" role="group" aria-label="撮る写真の形"><button type="button" data-cam-shape="4:3">4:3</button><button type="button" data-cam-shape="1:1">1:1</button></div><button id="cam-shutter" class="cam-shutter" type="button">撮る</button></div>
</section>
<section id="scan-layer" class="scan-layer" hidden aria-modal="true" role="dialog" aria-label="袋のラベルを読む">
  <div class="scan-head"><h2>袋のラベルを枠に入れてください</h2><button id="scan-close" type="button">閉じる</button></div>
  <div id="reader-wrap"><video id="scan-video" playsinline muted autoplay></video><div class="scan-guide"></div><div id="scan-tools" class="scan-tools" hidden><button id="scan-torch" type="button" aria-label="ライト" hidden>ライト</button><input id="scan-zoom" type="range" aria-label="ズーム" hidden></div></div>
  <p id="scan-tip">明るい場所で、ラベル全体を枠に入れてください</p>
  <div id="scan-result" class="scan-result" hidden>
    <p>読み取った番号</p>
    <div id="read-no" class="read-no"></div>
    <p>袋のラベルと同じ番号か確かめてください</p>
    <button id="read-ok" class="manual-go" type="button">この番号で進む</button>
    <button id="read-again" class="scan-link" type="button">読み直す</button>
  </div>
  <button id="scan-shot" class="scan-shot" type="button">撮影して読み取る</button>
  <input id="scan-shot-input" class="sr-only" type="file" accept="image/*" capture="environment">
  <button id="manual-open" class="scan-link" type="button">読めないときは番号を入力</button>
  <form id="manual-form" class="manual" hidden novalidate>
    <div class="prefix" role="group" aria-label="番号の種類"><button type="button" data-prefix="PKGI" class="on">PKGI</button><button type="button" data-prefix="BU">BU</button><button type="button" data-prefix="PKG">PKG</button><button type="button" data-prefix="other">その他</button></div>
    <input id="manual-no" type="text" inputmode="numeric" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="ラベルの数字" aria-label="ラベルの番号">
    <p id="manual-error" class="manual-error" role="alert"></p>
    <button type="submit" class="manual-go">この番号で進む</button>
  </form>
</section>
<script src="vendor/barcode-detector_3.2.2/ponyfill.js"></script>
<script>
'use strict';
var API='https://pqfsanwopptslgdrdebn.supabase.co/functions/v1/zigzag-shoot';
var MAX_PHOTOS=8;
var DB_NAME='zigzag_shoot_v1';
var DB_STORE='pending';
var _cam=null;
var _detectorP=null;
var _readCode='';
var _scanSession=0;
// 読み取りはマクサスのダッシュボード (app/_components/BarcodeScanner.js) と同じ方式にそろえる
var SCAN_FORMATS=['code_128','code_39','code_93','ean_13','ean_8','itf','codabar','qr_code'];
var _manualPrefix='PKGI';
var _labelSeq=0; var _draftSeq=0;
var _flushing=false;
var _candidatesReady=Promise.resolve();
var _edit=null,_edited=loadEdited(),_editLost=0;
// 送信中に直した内容は、サーバーに届くまで端末に残す（再読み込みしても消さない）
function loadEdited(){try{var value=JSON.parse(localStorage.getItem('zz_edited_v1')||'{}');return value&&typeof value==='object'?value:{};}catch(error){return {};}}
function saveEdited(){try{localStorage.setItem('zz_edited_v1',JSON.stringify(_edited));}catch(error){}}
async function applyEdit(clientId){var fix=_edited[clientId];if(!fix)return;if(_cancelled[clientId]){delete _edited[clientId];saveEdited();return;}
  try{await postEdit(clientId,fix.condition,fix.quantity);delete _edited[clientId];saveEdited();}
  catch(error){if(error.status===404||error.status===409){delete _edited[clientId];saveEdited();_editLost++;}}}
var state={stage:'label',photos:[],candidates:[],visibleCandidates:[],selected:null,selectedSet:false,condition:'',quantity:1,draft:{name:'',description:'',genre:''},size:'',memo:'',whiteout:false,draftBusy:false,draftDone:false,draftCandidate:null,nameEdited:false,aiUnavailable:false,label:'',error:'',managementNo:'',clientId:''};
var params=new URLSearchParams(location.search);
var worker=params.get('w')||'';
var mock=isMockMode(location.search);
var workerValid=mock||/^[A-Za-z0-9]{8}$/.test(worker);
var SHAPE_KEY='zigzag_shoot_shape';
var _shape=normalShape(safeStorageGet(SHAPE_KEY,'4:3'));
var _cancelled={};
var _mine={busy:false,items:[],error:''};
var _mockShots=[];

function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function normCode(s){
  s=String(s).toUpperCase().replace(/\s+/g,'');
  var m=s.match(/^(BU|PKGI|PKG)-?(\d+)$/);
  if(!m)return s;
  var d=m[2];while(d.length<8)d='0'+d;
  return m[1]+'-'+d;
}
function findCode(items,raw){
  var code=normCode(raw),by=function(col){return items.filter(function(it){return it[col]===code;});};
  var box=by('箱'),one=box.length?[]:by('PKGI');
  return {code:code,box:box,one:one,bag:(box.length||one.length)?[]:by('袋')};
}
function isMockMode(search){return new URLSearchParams(search).get('mock')==='1';}
function photoRule(count){return {enough:count>=2,full:count>=8,remaining:Math.max(0,8-count)};}
function normalShape(value){return value==='1:1'?'1:1':'4:3';}
// 1:1 は写真の中央を正方形に切り抜く
function cropRect(width,height,shape){if(normalShape(shape)!=='1:1')return {x:0,y:0,w:width,h:height};var side=Math.min(width,height);return {x:Math.floor((width-side)/2),y:Math.floor((height-side)/2),w:side,h:side};}
function cancelErrorText(status){
  if(status===409)return '出品の準備が始まっているため取り消せません。担当者に連絡してください';
  if(status===404)return 'この登録は見つかりませんでした';
  if(status===403)return 'この URL は使えません。担当者に連絡してください';
  return '取り消せませんでした。電波を確かめて、もう一度押してください';
}
function shotTime(iso){var d=new Date(iso);if(!iso||isNaN(d))return '';return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function isToday(iso){var d=new Date(iso),t=new Date();if(!iso||isNaN(d))return false;return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth()&&d.getDate()===t.getDate();}
function mineRowState(item){if(item.cancelled)return {tag:'取り消し済み',can:false};if(item.pending||item.cancellable)return {tag:'',can:true};return {tag:'出品準備中',can:false};}
// 直せるのは取込前の登録だけ。窓口が状態と数量を返さない古い版のときは「編集する」を出さない
function canEdit(item){return !item.cancelled&&(!!item.pending||(item.editable===true&&!!item.condition));}
function conditionText(value){return {new:'新品・未使用',good:'目立った傷なし',damaged:'傷や汚れあり'}[value]||'';}
function editErrorText(status){
  if(status===409)return '出品の準備が始まっているため直せません。担当者に連絡してください';
  if(status===404)return 'この登録は見つかりませんでした';
  if(status===403)return 'この URL は使えません。担当者に連絡してください';
  if(status===400)return '直せませんでした。状態と数量を選び直してください';
  return '保存できませんでした。電波を確かめて、もう一度押してください';
}
function primaryState(value){
  if(value.stage==='receipt')return {action:'next',label:'次の商品へ',enabled:true};
  if(value.stage==='mine'&&value.editing)return {action:'edit-save',label:value.editBusy?'保存しています':'この内容で保存',enabled:!value.editBusy};
  if(value.stage==='mine')return {action:'back',label:'撮影に戻る',enabled:true};
  if(value.stage==='label')return {action:'scan',label:'袋のラベルを読む',enabled:value.workerValid!==false};
  if(value.photos<2)return {action:'photo',label:'写真を撮る（あと'+(2-value.photos)+'枚）',enabled:true};
  if(!value.ready&&value.waiting)return {action:'save',label:value.waiting,enabled:false};
  return {action:'save',label:'登録して次へ',enabled:!!value.ready};
}
function publicText(value){
  return String(value||'')
    .replace(/PKGI[-_ ]?[A-Za-z0-9-]*/gi,'')
    .replace(/\bIT[-_ ]?[A-Za-z0-9-]*/gi,'')
    .replace(/(?:価格|仕入値?|販売価格)/g,'')
    .replace(/[¥￥]\s*[\d,]+|[\d,]+\s*円/g,'')
    .replace(/\s{2,}/g,' ').trim();
}
// AI が選んだ候補を先に並べ、袋に紐付く残りの候補もすべて後ろに出す
function orderedCandidates(candidates,topIds){var ids=Array.isArray(topIds)?topIds:[];var picked=ids.map(function(id){return candidates.find(function(item){return item.candidate_id===id;});}).filter(Boolean);var picked2=picked.filter(function(item,i){return picked.indexOf(item)===i;});return picked2.concat(candidates.filter(function(item){return picked2.indexOf(item)<0;}));}
function doneText(item){var done=Number(item&&item.done)||0,left=Number(item&&item.remaining)||0;if(done<=0)return '';if(left>0&&done>=left)return '残数ぶん登録済み';return '登録済み '+done+'点';}
function candidateViewNames(candidates,max){return candidates.slice(0,max).map(function(item){return publicText(item.name);});}
function dedupeQueue(items){
  var seen={},out=[];
  items.forEach(function(item){if(!item||!item.client_id)return;if(seen[item.client_id]===undefined){seen[item.client_id]=out.length;out.push(item);}else out[seen[item.client_id]]=item;});
  return out;
}
async function flushQueueList(items,send){
  var queue=dedupeQueue(items),remaining=[];
  for(var i=0;i<queue.length;i++){
    try{await send(queue[i]);}catch(error){remaining=remaining.concat(queue.slice(i));break;}
  }
  return remaining;
}
function makeUuid(){
  if(crypto.randomUUID)return crypto.randomUUID();
  var bytes=new Uint8Array(16);crypto.getRandomValues(bytes);bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;
  return Array.from(bytes,function(b){return b.toString(16).padStart(2,'0');}).join('').replace(/^(........)(....)(....)(....)/,'$1-$2-$3-$4-');
}

function openQueue(){

}

function manualCode(prefix,raw){
  var s=String(raw==null?'':raw);if(s.normalize)s=s.normalize('NFKC');s=s.toUpperCase().replace(/\s+/g,'');
  if(prefix==='other'){if(!/^[A-Z0-9][A-Z0-9-]{2,39}$/.test(s))return '';return normCode(s);}
  s=s.replace(/-/g,'');if(!/^\d{1,8}$/.test(s))return '';
  return normCode(prefix+'-'+s);
}

function getDetector(){

    catch(error){try{api.purgeZXingModule();}catch(error2){}throw error;}

// 印刷ラベル向け: 白黒にして明暗を引き伸ばす（退色や照明ムラの救済）
function enhanceForScan(cx,w,h){
  try{var img=cx.getImageData(0,0,w,h),d=img.data,min=255,max=0,i,g;
    for(i=0;i<d.length;i+=4){g=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000;d[i]=d[i+1]=d[i+2]=g;if(g<min)min=g;if(g>max)max=g;}
    if(max-min>8){var k=255/(max-min);for(i=0;i<d.length;i+=4){g=Math.max(0,Math.min(255,(d[i]-min)*k));d[i]=d[i+1]=d[i+2]=g;}}
    cx.putImageData(img,0,0);}catch(error){}
}
// 撮った静止画から読む。全体、中央の帯、中央の正方形の順に試し、読めなければ白黒を強めてもう一度
async function decodeStill(file){
  var detector=await getDetector(),image=await loadImageFile(file),cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  var readText=async function(){try{var found=await detector.detect(cv);var hit=found.find(function(c){return typeof c.rawValue==='string'&&c.rawValue.trim();});return hit?hit.rawValue:'';}catch(error){return '';}};
  var rois=[[1,1],[0.9,0.4],[0.55,0.55],[0.7,0.25],[0.4,0.4]];
  for(var i=0;i<rois.length;i++){
    var rw=Math.round(image.width*rois[i][0]),rh=Math.round(image.height*rois[i][1]),rx=Math.round((image.width-rw)/2),ry=Math.round((image.height-rh)/2),sc=Math.min(2,2200/Math.max(rw,rh));
    cv.width=Math.max(2,Math.round(rw*sc));cv.height=Math.max(2,Math.round(rh*sc));cx.drawImage(image,rx,ry,rw,rh,0,0,cv.width,cv.height);
    var t1=await readText();if(t1)return t1;
    enhanceForScan(cx,cv.width,cv.height);
    var t2=await readText();if(t2)return t2;
  }
  return '';
}
// 画面の枠（少し広め）が、カメラの元の映像のどこに当たるか。映像は object-fit:cover で画面に出している
function guideBox(vw,vh,cw,ch){
  var scale=Math.max(cw/vw,ch/vh),ox=(vw*scale-cw)/2,oy=(vh*scale-ch)/2;
  var gx=cw*0.02,gy=ch*0.27,gw=cw*0.96,gh=ch*0.46;
  return {x:(gx+ox)/scale,y:(gy+oy)/scale,w:gw/scale,h:gh/scale};
}
// 読めたバーコードのうち、中心が枠の中にあるものだけを採る（隣のラベルを拾わない）
function inGuide(hit,box){
  var b=hit&&hit.boundingBox;if(!b||!box)return true;
  var cx=b.x+b.width/2,cy=b.y+b.height/2;
  return cx>=box.x&&cx<=box.x+box.w&&cy>=box.y&&cy<=box.y+box.h;
}
function scanTick(){
  var cam=_cam;if(!cam)return;var video=cam.video;
  if(video.readyState<2){cam.timer=setTimeout(scanTick,200);return;}
  cam.detector.detect(video).then(function(found){
    if(_cam!==cam)return;
    var box=video.videoWidth&&video.clientWidth?guideBox(video.videoWidth,video.videoHeight,video.clientWidth,video.clientHeight):null;
    var hit=(found||[]).find(function(c){return typeof c.rawValue==='string'&&c.rawValue.trim()&&inGuide(c,box);});
    if(hit){var next=confirmRead(cam.last,hit.rawValue);cam.last=next.last;if(next.text){showRead(next.text);return;}}
    cam.timer=setTimeout(scanTick,200);
  },function(){if(_cam===cam)cam.timer=setTimeout(scanTick,200);});
}
// 読んだ番号を大きく出し、袋のラベルと見比べてから進める

document.getElementById('cam-video').addEventListener('loadedmetadata',layoutCam);
window.addEventListener('resize',layoutCam);
// 別のアプリに切り替えたらカメラを止め、戻ったら撮影画面が開いていれば起動し直す
document.addEventListener('visibilitychange',function(){if(document.hidden){stopShotCam();return;}if(camOpen()&&!_shotCam&&!_camFallback)startShotCam();});
document.getElementById('manual-open').addEventListener('click',function(){showManual('');document.getElementById('manual-no').focus();});
document.getElementById('manual-form').addEventListener('click',function(event){var button=event.target.closest('[data-prefix]');if(!button)return;setPrefix(button.dataset.prefix);document.getElementById('manual-error').textContent='';document.getElementById('manual-no').focus();});
document.getElementById('manual-form').addEventListener('submit',function(event){
  event.preventDefault();var input=document.getElementById('manual-no'),code=manualCode(_manualPrefix,input.value);
  if(!code){document.getElementById('manual-error').textContent=_manualPrefix==='other'?'ラベルの番号を入力してください':'ラベルの数字を8桁まで入力してください';return;}
  input.blur();closeScan();loadLabel(code);
});
document.getElementById('app').addEventListener('click',function(event){
  var target=event.target.closest('button');if(!target)return;
  if(target.dataset.action==='no-label'){startWithoutLabel();return;}
  if(target.dataset.action==='mine'){openMine();return;}
  if(target.dataset.action==='cancel-this'){cancelThis();return;}
  if(target.dataset.cancel){if(_edit&&_edit.busy)return;cancelFromList(target.dataset.cancel);return;}
  if(target.dataset.edit){openEdit(target.dataset.edit);return;}
  if(target.dataset.action==='edit-close'){if(_edit&&_edit.busy)return;_edit=null;render();return;}
  if(target.dataset.editCondition&&_edit&&!_edit.busy){_edit.condition=target.dataset.editCondition;render();return;}
  if(target.dataset.editQuantity&&_edit&&!_edit.busy){_edit.quantity=Math.max(1,Math.min(999,_edit.quantity+Number(target.dataset.editQuantity)));render();return;}
  if(target.dataset.shape){setShape(target.dataset.shape);return;}
  if(target.dataset.action==='relabel'){relabel();return;}
  if(target.dataset.action==='add-photo'){openShotCam();return;}
  if(target.dataset.action==='pick-photo'){document.getElementById('pick-input').click();return;}
  if(target.dataset.remove!==undefined){var index=Number(target.dataset.remove);state.photos.splice(index,1);if(state.photos.length<2){_draftSeq++;state.draftBusy=false;state.draftDone=false;state.visibleCandidates=[];state.selected=null;state.selectedSet=!state.label;}render();return;}
  if(target.dataset.action==='regen-name'){if(!state.draftBusy)createDraft({redo:true,prevName:state.draft.name});return;}
  if(target.dataset.candidate!==undefined){state.autoPicked=false;state.selected=target.dataset.candidate==='none'?null:target.dataset.candidate;state.selectedSet=true;if(shouldRedoForPick(state.selected))createDraft({redo:true});else render();return;}
  if(target.dataset.condition){state.condition=target.dataset.condition;render();return;}
  if(target.dataset.quantity){state.quantity=Math.max(1,Math.min(999,state.quantity+Number(target.dataset.quantity)));render();}
});
document.getElementById('app').addEventListener('input',function(event){
  if(event.target.id==='edit-name'){state.draft.name=event.target.value;state.nameEdited=true;}
  else if(event.target.id==='edit-description')state.draft.description=event.target.value;
  else if(event.target.id==='edit-size')state.size=event.target.value;
  else if(event.target.id==='edit-memo'){state.memo=event.target.value;var count=document.getElementById('memo-count');if(count)count.textContent=event.target.value.length+' / 500';}
});
document.getElementById('app').addEventListener('change',function(event){if(event.target.id==='edit-whiteout')state.whiteout=!!event.target.checked;});
document.getElementById('read-ok').addEventListener('click',function(){var code=_readCode;if(!code)return;closeScan();loadLabel(code);});
document.getElementById('read-again').addEventListener('click',function(){openScan();});
document.getElementById('scan-shot').addEventListener('click',function(){document.getElementById('scan-shot-input').click();});
document.getElementById('scan-shot-input').addEventListener('change',async function(){
  var file=this.files&&this.files[0];this.value='';if(!file)return;
  var tip=document.getElementById('scan-tip'),button=document.getElementById('scan-shot'),session=_scanSession;button.disabled=true;tip.textContent='写真から番号を読んでいます';
  try{
    var text=await decodeStill(file);
    // 読んでいる間に閉じたり開き直したりしたら、古い写真の結果は捨てる
    if(session!==_scanSession)return;
    if(text){showRead(text);return;}
    tip.textContent='読み取れませんでした。ラベルを画面いっぱいに写して撮り直すか、番号を入力してください';
  }
  catch(error){if(session===_scanSession)tip.textContent='読み取れませんでした。番号を入力してください';}
  finally{button.disabled=false;}
});
document.getElementById('scan-torch').addEventListener('click',async function(){var cam=_cam;if(!cam||!cam.track)return;try{await cam.track.applyConstraints({advanced:[{torch:!cam.torch}]});cam.torch=!cam.torch;this.classList.toggle('on',cam.torch);}catch(error){}});
document.getElementById('scan-zoom').addEventListener('input',async function(){var cam=_cam;if(!cam||!cam.track)return;try{await cam.track.applyConstraints({advanced:[{zoom:parseFloat(this.value)}]});}catch(error){}});
window.addEventListener('online',flushQueue);
showIntro();render();updateStatus().then(flushQueue);
</script>
</body>
</html>

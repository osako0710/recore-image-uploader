<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>現物確認</title>
<style>
.chip.sm{min-height:44px;padding:6px 12px;font-size:14px}
:root{
  --bg:#f4f5f7; --card:#fff; --line:#dfe3e8; --tx:#16202b; --sub:#63707e;
  --pri:#1565d8; --pri-d:#0f4ea8; --ok:#0f9d58; --ng:#d93025; --warn:#b06000;
  --chip:#eef1f5; --gray:#9aa5b1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top))}
header .ttl{font-weight:700;font-size:17px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header button{min-width:44px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:15px;color:var(--tx)}
main{padding:10px 10px 120px}
.sec{margin:14px 2px 6px;font-size:13px;color:var(--sub);font-weight:700}
.prog{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.prog .t{font-size:19px;font-weight:700}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:15px;min-height:56px;color:var(--tx)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.chip.tk{background:#fff7e6;border-color:#f0d9a8}
.chip.tk.on{background:var(--pri);border-color:var(--pri);color:#fff}
details.flt .chip{min-height:44px;padding:6px 14px;font-size:14px}
details.flt select{width:100%;min-height:48px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--tx)}
details.flt .sw{background:none;border:none;padding:0;min-height:44px}

.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ngb{background:#fff;border-color:var(--ng);color:var(--ng)}
.btn.sm{min-height:56px;font-size:15px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.btns .two{display:flex;gap:8px}
.btns .two .btn{flex:1}
.q{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:12px;padding:14px}
.q .qq{font-size:20px;font-weight:700;line-height:1.35}
.q .pt{font-size:12.5px;color:var(--sub);margin-top:8px}
.meta{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.meta .nm{font-size:16px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}

.slot .sl{flex:1;min-width:0}

.slot .thumbs{margin-top:6px}

.lnk{display:block;border:none;background:none;color:var(--pri);font-size:14px;text-decoration:underline;padding:10px 0 0;min-height:44px;text-align:left}

.hint{font-size:12px;color:var(--sub);margin-top:6px}
.empty{text-align:center;color:var(--sub);padding:28px 10px;font-size:14px}
.donebox{background:#e9f7ec;border:1px solid #bfe3c8;color:#0b6b33;border-radius:12px;padding:14px;font-weight:700;text-align:center}

.note{background:#fff8e1;border:1px solid #f0d98a;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6;margin-top:10px}
details.rest{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
details.rest summary{min-height:52px;display:flex;align-items:center;font-weight:700;color:var(--sub);list-style:none}
details.rest summary::-webkit-details-marker{display:none}
details.rest[open]{padding-bottom:8px}
.restrow{padding:8px 0;border-top:1px solid var(--line);color:var(--sub);font-size:14px}
.restrow .mt{font-size:12px;margin-top:2px}
#toast{position:fixed;left:10px;right:10px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#toast div{background:#222c38;color:#fff;border-radius:10px;padding:11px 13px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#toast div.ok{background:#12603a}
#toast div.warn{background:#8a3a00}
#toast div.ng{background:#9b1c13}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none}
.sheet.open{display:block}
.sheet .in{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;padding:14px 14px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:4px 0 12px;font-size:17px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:52px;margin-top:8px}
.sw b{font-size:15px}
.loading{text-align:center;padding:40px 10px;color:var(--sub)}
.scanbtn{display:block;width:100%;min-height:72px;border-radius:14px;border:none;background:var(--pri);color:#fff;font-size:21px;font-weight:700;box-shadow:0 3px 10px rgba(21,101,216,.3)}
details.flt{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
details.flt summary{min-height:52px;display:flex;align-items:center;font-weight:700;color:var(--sub);list-style:none}
details.flt summary::-webkit-details-marker{display:none}
details.flt[open]{padding-bottom:12px}
#sync{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));font-size:15px;font-weight:700;text-align:center}
#sync.ok{color:var(--ok)}
#sync.wait{color:var(--warn);background:#fff7e6}
#sync.ng{color:#fff;background:var(--ng,#c0392b);cursor:pointer}
#toast{bottom:64px!important}
.intro{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.intro .in{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:420px}
.intro ol{margin:0 0 16px;padding-left:1.4em;font-size:18px;line-height:1.9;font-weight:600}
</style>
</head>
<body>

  <button id="back" style="display:none">戻る</button>

<script src="vendor/html5-qrcode_2.3.8.min.js"></script>
<script>

var COLORS=['黒','白','赤','青','緑','黄','ピンク','紫','茶','グレー','ベージュ','その他'];

var STORAGES=['常温良好','高温多湿あり','液漏れ・膨張','不明'];

var LABELS=['あり','なし'];
// 出品に使う写真の枠 [保存する記号, 画面の名前, 撮り方]。枠の無い写真はメモ用
var SLOTS=[['f','正面','全体が入るように'],['b','裏・ラベル','型番やバーコードの数字が読めるように'],['x','別の角度','光の当たり方を変えて、もう 1 枚'],['d','傷・汚れの所','気になる所を大きく'],['a','付属品','全部並べて']];

var CONDS=[['new','新品・未開封'],['opened','開封済み・使っていない'],['used','使ったあとがある・きれい'],['damaged','汚れ・傷・破れ・こわれ・におい・欠品がある']];
var COND_BAD='damaged';
var COND_OLD={'未開封':'new','開封済み未使用':'opened','使用感あり':'used','傷・欠品':COND_BAD}; // 前の版の「状態」の答え
// 4 つ目を選んだときに聞く「何があるか」。写真が要るのは PROB_PHOTO の 3 つ（におい・付属品は写真に写らない）
var PROBS=[['dirt','汚れ'],['scratch','傷'],['broken','破れ・こわれ'],['smell','におい'],['missing','付属品が足りない']];
var PROB_PHOTO=['dirt','scratch','broken'];
var PLACES=[['hem','裾'],['cuff','袖口'],['neck','襟・首まわり'],['front','前'],['back','後ろ'],['bottom','底'],['inside','内側'],['tag','タグ'],['metal','金具'],['other','そのほか']];
var MISSING=[['box','箱'],['manual','説明書'],['charger','充電器'],['cable','ケーブル'],['strap','ストラップ'],['lid','ふた'],['case','袋・ケース'],['spare','替えの部品'],['other','そのほか']];
function labelMap(a){var m={};a.forEach(function(x){m[x[0]]=x[1];});return m;}
var COND_LABEL=labelMap(CONDS),PROB_LABEL=labelMap(PROBS),PLACE_LABEL=labelMap(PLACES),MISSING_LABEL=labelMap(MISSING);
var SHIPS=[['60','60 まで'],['80','80 まで'],['100','100 まで'],['140','140 まで'],['160','160 まで'],['over','160 より大きい']];
var SHIP_LABEL={};SHIPS.forEach(function(x){SHIP_LABEL[x[0]]=x[1];});
var FIELD_LABEL={qty:'現物数量',presence:'現物の有無',photo:'写真',candidate:'候補の商品と同じか',url:'参考URL（見つかった場合）',color:'色',size:'サイズ',edition:'版・型番',set:'セット内容（何が何個）',expiry:'賞味期限',storage:'保管状態',condition:'状態',label:'在庫ラベルの有無'};
// 一覧の「質問」「見るポイント」の社内用語を、画面に出すときだけ言い換える（一覧と保存の形は変えない）
var PT_MAP={'在庫ラベル(IT)の有無':'在庫ラベルの有無','bonus_or_purchase_benefit_presence':'特典・購入特典の有無','箱番号・実所在':'箱番号・実際の所在','箱番号・所在':'箱番号・実際の所在'};
var PT_KEEP=/ない$|未確認|未確定|未取得|保留|別管理|保存本文/; // 出品の担当者向けの注意の文は、言い換えない
function plainWords(s){
  return String(s||'').split('。').map(function(x){
    return PT_KEEP.test(x)?x:x.replace(/JAN/g,'バーコード').replace(/元名/g,'元の商品名');
  }).join('。');
}
function plainPoint(s){ // 「、」と「 / 」で分けた部品ごとに言い換える。同じ言葉になった部品は 1 つにまとめる
  var seen={},out='';
  String(s||'').split(/(、| \/ )/).forEach(function(x,i,a){
    if(i%2)return;
    var p=PT_MAP.hasOwnProperty(x)?PT_MAP[x]:plainWords(x);

var ROW_MAX=2048;       // 窓口が受け取る 1 行の大きさ（バイト）

/* ---------- utils ---------- */
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  $('#toast').appendChild(d); setTimeout(function(){d.remove();},kind==='ng'?6000:3200);

function nowISO(){return new Date().toISOString();}
function pad(n){return n<10?'0'+n:''+n;}

/* ---------- CSV parser (RFC4180) ---------- */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  var rows=[],row=[],f='',q=false,i,c;
  for(i=0;i<text.length;i++){
    c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else {q=false;} }
      else f+=c;
    }else{
      if(c==='"'){q=true;}
      else if(c===','){row.push(f);f='';}
      else if(c==='\r'){ if(text[i+1]==='\n')i++; row.push(f);f='';rows.push(row);row=[]; }
      else if(c==='\n'){ row.push(f);f='';rows.push(row);row=[]; }
      else f+=c;
    }
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.filter(function(r){return r.some(function(x){return x!=='';});});
}
function csvToItems(text){
  var rows=parseCSV(text); if(!rows.length)return [];
  var head=rows[0],out=[],i,j,o;
  for(i=1;i<rows.length;i++){
    o={}; for(j=0;j<head.length;j++)o[head[j]]=rows[i][j]==null?'':rows[i][j];
    o._key=o['PKGI']+'|'+o['行'];
    o._flds=parseFields(o['fields']);
    o._qty0=num(o['元数量'],1);
    out.push(o);
  }
  return out;
}
function parseFields(s){
  return String(s||'').split(',').map(function(t){return t.trim();}).filter(Boolean).map(function(t){
    var req=t.slice(-1)==='!';
    return {n:req?t.slice(0,-1):t,req:req};
  });
}

function loadLS(){

var _saveT=null,_imgWarned=false;
function persist(now){
  if(_saveT){clearTimeout(_saveT);_saveT=null;}
  if(!now){_saveT=setTimeout(function(){_saveT=null;persist(true);},250);return;}
  try{
    localStorage.setItem(LS_KEY,JSON.stringify({version:3,updatedAt:nowISO(),results:ST.results}));
  }catch(e){toast('この端末に保存できませんでした（ブラウザの保存領域が使えない可能性があります）','ng');}

/* ---------- 完了判定 ---------- */
function res(k){return ST.results[k];}
function isDone(k){var r=ST.results[k];if(FAILED&&FAILED.indexOf(k)>=0)return false;return !!r&&(r.absent===true||(!!r.checkedAt&&r.skipped!==true));}
function hasIssue(k){var r=ST.results[k];return !!r&&!!r.issues&&r.issues.length>0;}
function isSkipped(k){var r=ST.results[k];return !!r&&r.skipped===true;}

/* ---------- index ---------- */
function buildIndex(){
  ST.byKey={};ST.boxMap={};ST.boxes=[];
  ST.items.forEach(function(it){
    ST.byKey[it._key]=it;
    var b=ST.boxMap[it['箱']];
    if(!b){b={id:it['箱'],type:it['箱種別'],months:{},bags:{},rows:[]};ST.boxMap[it['箱']]=b;ST.boxes.push(b);}
    b.months[it['月']]=1; b.bags[it['袋']]=1; b.rows.push(it);
  });
  ST.boxes.forEach(function(b){
    b.rows.sort(function(x,y){
      if(x['袋']!==y['袋'])return x['袋']<y['袋']?-1:1;
      var a=num(x['行'],0),c=num(y['行'],0);
      if(a!==c)return a-c;
      return x['PKGI']<y['PKGI']?-1:1;
    });
    b.monthList=Object.keys(b.months); b.bagCount=Object.keys(b.bags).length;
  });
}
function matchFilter(it){
  var f=ST.filters;
  if(f.month&&it['月']!==f.month)return false;
  if(f.task&&it['task']!==f.task)return false;
  if(f.q){
    var q=f.q.toLowerCase();
    var hay=(it['PKGI']+' '+it['商品名']+' '+it['行']+' '+it['箱']+' '+it['袋']+' '+it['task名']).toLowerCase();
    if(hay.indexOf(q)<0)return false;
  }
  return true;
}
function stats(){
  var total=0,remain=0;
  ST.items.forEach(function(it){ if(!matchFilter(it))return; total++; if(!isDone(it._key))remain++; });
  return {total:total,remain:remain};
}
function boxStat(b){
  var total=0,remain=0,later=0;
  b.rows.forEach(function(it){ if(!matchFilter(it))return; total++; if(!isDone(it._key)){remain++; if(isSkipped(it._key))later++;} });
  return {total:total,remain:remain,later:later};
}
function boxRows(b){return b.rows.filter(matchFilter);}

/* ---------- 箱の中身・同じ名前の商品 ---------- */
var KIND_LABEL={ok:'登録済み',gone:'出荷済み（箱に無いはず）',hold:'注文あり（動かさない）',etc:'確認不要'};
function ctxRest(boxId){var a=CTX&&CTX.boxes&&CTX.boxes[boxId];return Array.isArray(a)?a:[];}
function restRow(x){return '<div class="restrow"><div>'+esc(x[1])+'</div><div class="mt">'+esc(x[2])+' 点・'+esc(KIND_LABEL[x[3]]||'確認不要')+'</div></div>';}
function ctxSame(k){return (CTX&&CTX.same&&CTX.same[k])||null;}
function hasQtyField(k){return ST.byKey[k]._flds.some(function(f){return f.n==='qty';});}
// 同じ箱に同じ名前の行がある → どれがどの行の分か見分けられないので、箱の中のその商品を全部数える
function sameBox(k){var s=ctxSame(k);return (s&&s.box&&s.box.length&&hasQtyField(k))?s:null;}
function qtyDefault(k){
  var it=ST.byKey[k],s=sameBox(k);
  if(!s)return it._qty0;
  // 同じ名前の別の行をすでに合計で数えていたら、その数を初期値にする
  var c=sameCounted(k);
  return c!=null?c:num(s.sum,it._qty0);
}
function qtyStale(k){ // 合計の案内を見ずに入っていた数量（更新前の下書き・保留にした行の初期値）。合計としては使えない
  var r=ST.results[k]||{};
  return (r.qty===0||r.qty)&&(!r.checkedAt||r.skipped===true)&&r.absent!==true&&r.qtyScope!=='box'&&!!sameBox(k);
}
function qtyTouch(){qtyAuto=false;qtyHand=true;}
function qtyReset(){ // 触っていない数量を初期値に出し直す（2 色以上に分けていたら、先頭の色で合計を合わせる）
  var q=qtyDefault(draftKey),ps=colorParts(draft.color);
  if(ps.length>=2){
    var rest=ps.slice(1).reduce(function(a,p){return a+(p.n||0);},0);
    ps[0].n=Math.max(1,q-rest);draft.color=colorJoin(ps);q=rest+ps[0].n;
  }
  draft.qty=q;
}
function ctxSt(k){return (CTX&&CTX.st&&CTX.st[k])||'';} // 確認する行そのものの状態（gone=出荷済み / hold=注文あり）
function sameCountedRow(k){ // 同じ箱の同じ名前の別の行で、合計として保存済みの回答（無ければ null）
  var it=ST.byKey[k],s=sameBox(k);
  if(!s)return null;
  var rows=ST.boxMap[it['箱']].rows;
  for(var i=0;i<rows.length;i++){
    var kk=rows[i]._key,r=ST.results[kk];
    if(kk!==k&&s.box.indexOf(num(rows[i]['行'],-1))>=0&&r&&r.qtyScope==='box'&&r.absent!==true&&isDone(kk))return r;
  }
  return null;
}
function sameCounted(k){var r=sameCountedRow(k),s=sameBox(k);return r?num(r.qty,s.sum):null;}
function isBoxTag(v){return String(v).indexOf(BOX_TAG)===0;}
// 箱ごと確認の写真は 1 行にだけ付く。同じ箱のほかの保留行からも見えるようにする
function boxPhotos(k){
  var r=ST.results[k],it=ST.byKey[k],b=ST.boxMap[it['箱']],own=(draft&&draftKey===k)?draft.images:((r&&r.images)||[]),out=[];
  if(!r||!b||!(r.issues||[]).some(isBoxTag))return out;
  b.rows.forEach(function(x){
    var o=ST.results[x._key];
    if(x._key===k||!o||!(o.issues||[]).some(isBoxTag))return;
    (o.images||[]).forEach(function(n){if(own.indexOf(n)<0&&out.indexOf(n)<0)out.push(n);});
  });
  return out;
}

/* ---------- カード ---------- */
function startDraft(k){
  var r=ST.results[k]||{},it=ST.byKey[k];
  draftKey=k;errFields={};issOpen=false;
  qtyAuto=!(r.qty===0||r.qty);qtyHand=false;
  draft={
    qty:(r.qty===0||r.qty)?r.qty:qtyDefault(k),
    absent:r.absent===true?true:(r.absent===false?false:undefined),
    candidateOk:(r.candidateOk===true||r.candidateOk===false)?r.candidateOk:undefined,
    refUrl:r.refUrl||'',color:r.color||'',size:r.size||'',edition:r.edition||'',
    setContents:r.setContents||'',expiry:r.expiry||'',storage:r.storage||'',
    condition:r.condition||'',hasLabel:r.hasLabel||'',
    images:(r.images||[]).slice(),issues:(r.issues||[]).slice(),note:r.note||'',
    cond:(COND_LABEL[r.cond]?r.cond:'')||COND_OLD[r.condition]||'',
    condProblems:(r.condProblems||[]).slice(),condPlaces:{},missingParts:(r.missingParts||[]).slice(),
    shipClass:r.shipClass||r.ship||'',shipIrregular:r.shipIrregular===true||r.shipOdd===true,colorHard:r.colorHard===true,
    slots:Object.assign({},r.slots||{})
  };
  Object.keys(r.condPlaces||{}).forEach(function(p){draft.condPlaces[p]=(r.condPlaces[p]||[]).slice();});
  if(qtyStale(k))qtyAuto=true;
  // 同じ名前の別の行で色ごとの数を入れてあれば、数量と同じく初期値として引き継ぐ（色違いを入れ直させない）
  var sc=sameCountedRow(k);

  colorFix();
  if(qtyAuto&&draft.absent!==true)qtyReset();
  // 2 色以上の記録は色ごとの数が正。合計と食い違っていたら合計を直し、確かめてもらう
  var ps=colorParts(draft.color);
  if(ps.length>=2&&draft.absent!==true&&num(draft.qty,-1)!==colorSum(ps)){

function qtySync(){ // 2 色以上のときは、色ごとの数の合計を現物数量にする（保存の直前に必ず計算し直す）

function saveDraft(){ // 入力のたびの自動保存（完了にはしない）
  if(!draftKey)return;
  linkSync();

  if(prev.checkedAt)return; // 保存済みの行は「保存」を押すまで書き換えない（押さずに離れた変更を送らない）
  qtySync();
  var o=slim(Object.assign({},prev,draft));
  // 触っていない数量は下書きに残さない（箱の中身の一覧が後から届いたら、初期値を出し直す）
  if(qtyAuto&&!(prev.qty===0||prev.qty))delete o.qty;
  // 合計の案内を見て自分で入れた数量には、下書きの時点で印を付ける（開き直したときに初期値へ戻さない）
  if(qtyHand&&draft.absent!==true&&sameBox(draftKey))o.qtyScope='box';

  if(draft.candidateOk===false){ // 違う → url と photo を必須に昇格
    ['url','photo'].forEach(function(n){

  }

  if(shootOn())t=t.filter(function(x){return x.n!=='photo'&&x.n!=='condition';});

function shootOn(){return !!draft&&draft.absent!==true;}
// 枠の値は 1 文字。傷の枠だけ、写っている問題を後ろに付ける（例 d:dirt+scratch）
function slotOf(nm){return String((draft.slots&&draft.slots[nm])||'').charAt(0);}
function slotImgs(sl){return draft.images.filter(function(nm){return slotOf(nm)===sl;});}
function slotName(sl){var c=String(sl||'').charAt(0),x=SLOTS.filter(function(s){return s[0]===c;})[0];return x?x[1]:'';}
function linksIn(v){v=String(v||'');return v.charAt(1)===':'?v.slice(2).split('+').filter(Boolean):[];}
function linksOf(nm){return linksIn(draft.slots&&draft.slots[nm]);}
function setLinks(nm,ps){draft.slots[nm]='d'+(ps.length?':'+ps.join('+'):'');}
function photoProbs(){ // 写真が要る問題（選んだ順ではなく決まった順）
  return draft.cond===COND_BAD?PROB_PHOTO.filter(function(p){return draft.condProblems.indexOf(p)>=0;}):[];
}
function unlinked(){ // どの写真にも結び付いていない問題
  var ds=slotImgs('d');
  return photoProbs().filter(function(p){return !ds.some(function(nm){return linksOf(nm).indexOf(p)>=0;});});
}
function linkSync(){ // 選んでいない問題との結び付きを外す。問題が 1 つだけなら、傷の枠の写真は全部その問題の写真にする
  if(!draft||!draft.slots)return;
  var pp=photoProbs();
  slotImgs('d').forEach(function(nm){
    var ls=linksOf(nm).filter(function(p){return pp.indexOf(p)>=0;});
    if(pp.length===1&&!ls.length)ls=[pp[0]];
    setLinks(nm,ls);
  });
}
function needSlots(){
  var cp=colorParts(draft.color),need=['f','b'];
  // 色が写真 1 枚では決めにくい行は、光を変えた 1 枚を足してもらう
  if(draft.colorHard||cp.length>=2||cp.some(function(p){return p.c==='その他';}))need.push('x');
  if(photoProbs().length)need.push('d');
  return need;
}
function missSlots(){return needSlots().filter(function(sl){return !slotImgs(sl).length;});}
function slim(o){ // 新しい項目は、入っているときだけ残す（保存先の 1 行の大きさに収める）
  var sl=o.slots||{},t={},n=0;
  var pr=o.cond===COND_BAD?(o.condProblems||[]):[],pl={},pn=0;
  (o.images||[]).forEach(function(nm){
    if(!sl[nm])return;
    var c=String(sl[nm]).charAt(0),ls=c==='d'?linksIn(sl[nm]).filter(function(p){return pr.indexOf(p)>=0&&PROB_PHOTO.indexOf(p)>=0;}):[];
    t[nm]=c+(ls.length?':'+ls.join('+'):'');n++;
  });
  if(n)o.slots=t; else delete o.slots;
  // 状態の内訳は、4 つ目を選んでいるときだけ残す。場所は選んでいる問題の分だけ
  if(pr.length)o.condProblems=pr.slice(); else delete o.condProblems;
  PROB_PHOTO.forEach(function(p){var a=(o.condPlaces||{})[p];if(pr.indexOf(p)>=0&&a&&a.length){pl[p]=a.slice();pn++;}});
  if(pn)o.condPlaces=pl; else delete o.condPlaces;
  if(pr.indexOf('missing')>=0&&o.missingParts&&o.missingParts.length)o.missingParts=o.missingParts.slice(); else delete o.missingParts;
  ['condParts','ship','shipOdd'].forEach(function(f){delete o[f];}); // 前の形の項目は残さない
  ['cond','shipClass'].forEach(function(f){if(!o[f])delete o[f];});
  ['shipIrregular','colorHard'].forEach(function(f){if(o[f]!==true)delete o[f];});
  return o;
}

  var miss=shootOn()?missSlots():[],unl=shootOn()&&!miss.length?unlinked():[];

     :(miss.length||unl.length)?'<label class="btn pri">📷 写真を撮る（'+esc(shotP?PROB_LABEL[shotP]:slotName(shotSl))+'）'+shotInput(shotSl,shotP)+'</label><div class="hint" style="text-align:center;margin-top:0">'+NO_FACE+'</div>'

/* ---------- 検証と保存 ---------- */
function valOf(n){
  if(n==='qty')return (draft.qty===0||draft.qty)?String(draft.qty):'';
  if(n==='presence')return draft.absent===true||draft.absent===false?'x':'';
  if(n==='photo')return draft.images.length?'x':'';
  if(n==='candidate')return draft.candidateOk===true||draft.candidateOk===false?'x':'';
  if(n==='url')return draft.refUrl;
  if(n==='set')return draft.setContents;
  if(n==='label')return draft.hasLabel;
  return draft[n]||'';
}
function validate(){
  errFields={};var ok=true;
  activeFields().forEach(function(tk){
    if(!tk.req)return;
    var v=valOf(tk.n);
    if(v===''||v==null){errFields[tk.n]=1;ok=false;}
    if(tk.n==='qty'&&draft.absent!==true&&num(draft.qty,-1)<0){errFields.qty=1;ok=false;}
  });
  if(draft.issues.indexOf('その他')>=0&&!String(draft.note||'').trim()&&!draft.images.length){errFields.note=1;ok=false;}
  // サイズ・柄の違いは文字では書ききれないので、写真を必須にする
  // すでに写真が付いている行で選んだときは、選んだ後に撮った写真を 1 枚求める（前の写真では並べた様子が分からない）
  var mo=mixOld[draftKey];
  if(draft.issues.indexOf(ISSUE_MIX)>=0&&(mo?!draft.images.some(function(n){return mo.indexOf(n)<0;}):!draft.images.length)){errFields.note=2;ok=false;}
  if(String(draft.note||'').length>NOTE_MAX){errFields.note='メモは '+NOTE_MAX+' 字までにしてください';ok=false;}
  if(activeFields().some(function(tk){return tk.n==='color';})){
    var ps=colorParts(draft.color);
    if(ps.length>=2&&draft.absent!==true&&ps.some(function(p){return p.n==null;})){errFields.color='色ごとの数を入れてください';ok=false;}
  }
  if(shootOn()){
    linkSync();
    if(!draft.cond){errFields.cond=1;ok=false;}
    else if(draft.cond===COND_BAD){
      var noPlace=photoProbs().filter(function(p){return !(draft.condPlaces[p]||[]).length;});
      if(!draft.condProblems.length){errFields.cond='何があるか、1 つ以上選んでください';ok=false;}
      else if(noPlace.length){errFields.cond='「'+PROB_LABEL[noPlace[0]]+'」の場所を選んでください';ok=false;}
      else if(draft.condProblems.indexOf('missing')>=0&&!draft.missingParts.length){errFields.cond='足りない物を 1 つ以上選んでください';ok=false;}
    }
    // 正面 2 枚では足りない。枠ごとに 1 枚以上あるかを見る
    if(missSlots().length){errFields.slots=1;ok=false;}
    // 汚れ・傷・破れやこわれは、問題ごとに写真が 1 枚以上要る
    else if(unlinked().length){errFields.slots='「'+unlinked().map(function(p){return PROB_LABEL[p];}).join('」「')+'」が写っている写真がありません。写真の横で選ぶか、もう 1 枚撮ってください';ok=false;}
    if(!draft.shipClass&&!draft.shipIrregular){errFields.shipClass=1;ok=false;}
  }
  return ok;
}
function rowBytes(o){return new TextEncoder().encode(JSON.stringify(o)).length;}
// 1 行が窓口の上限を超えるときに、短くしてもらう欄（いちばん長い文字の欄）を返す。超えていなければ null
var LONG_FIELDS=[['note','note','メモ'],['refUrl','url','参考URL'],['setContents','set','セット内容'],['edition','edition','版・型番'],['color','color','色'],['size','size','サイズ']];
function rowTooBig(o){
  if(rowBytes(o)<=ROW_MAX)return null;
  var best=null,len=0;
  LONG_FIELDS.forEach(function(f){var l=String(o[f[0]]||'').length;if(l>len){len=l;best=f;}});
  var shown=best&&(best[1]==='note'||activeFields().some(function(tk){return tk.n===best[1];}));
  return shown&&len>20?{f:best[1],msg:best[2]+'が長すぎます。短くしてください'}:{f:'note',msg:'この商品の記録が大きすぎて保存できません。担当者に伝えてください'};
}
function commit(mode){ // mode: save | absent | later。保存できたら true
  qtySync();linkSync();
  var k=draftKey,prev=ST.results[k]||{},o=slim(Object.assign({},prev,draft));
  if(mode==='absent'){o.absent=true;o.qty=0;o.skipped=false;o.checkedAt=nowISO();}
  else if(mode==='later'){o.skipped=true;o.checkedAt=nowISO();}
  else{o.absent=draft.absent===true;o.skipped=false;o.checkedAt=nowISO();o.qty=num(draft.qty,0);}
  // 同じ名前の行の合計で数えた数量には印を付ける（行ごとの数量と区別する）
  // 箱の中身の一覧が読めていないときは、前に付いた印を消さない（合計の数だけ残って行ごとの数に見えるのを防ぐ）
  if(mode==='absent'||(mode==='save'&&o.absent))delete o.qtyScope;
  else if(mode==='save'){if(sameBox(k))o.qtyScope='box'; else if(CTX)delete o.qtyScope;}
  // 窓口が受け取れない大きさの行は、送る前に止めて原因の欄を示す（保存済みにしない）
  var big=rowTooBig(o);
  if(big){errFields={};errFields[big.f]=big.msg;return false;}
  ST.results[k]=o;persist(true);
  enqueue(k);flush();
  return true;
}
function commitOrShow(mode){ // 保存できなければ、原因の欄を見せて止める
  if(commit(mode))return true;
  renderCard(true);toast('保存できませんでした。赤い欄を直してください','ng');
  var el=document.querySelector('.fld.err');if(el)el.scrollIntoView({block:'center'});
  return false;
}
function gotoNext(){
  if(issKey&&issKey===draftKey){draftKey=null;ST.view='issues';render();return;}
  var it=ST.byKey[draftKey],b=ST.boxMap[it['箱']],rows=boxRows(b);
  var keys=rows.map(function(x){return x._key;}),i=keys.indexOf(draftKey),j;
  for(j=1;j<=keys.length;j++){
    var kk=keys[(i+j)%keys.length];
    if(!isDone(kk)){ draftKey=null;ST.cardKey=kk;ST.view='card';render();return; }
  }
  draftKey=null;ST.view='box';ST.boxId=b.id;render();
  toast('この箱の確認が完了しました','ok');
}

/* ---------- 画像 ---------- */
function loadImageFile(file){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){resolve(img);URL.revokeObjectURL(url);};
    img.onerror=function(e){reject(e);URL.revokeObjectURL(url);};
    img.src=url;
  });
}
var MAX_PHOTO=1400*1024; // 窓口の上限 1.5MB より少し下
function toJpeg(img,max,q){
  var s=Math.min(1,max/Math.max(img.width,img.height));
  var cw=Math.max(1,Math.round(img.width*s)),ch=Math.max(1,Math.round(img.height*s));
  var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
  cv.getContext('2d').drawImage(img,0,0,cw,ch);
  return cv.toDataURL('image/jpeg',q);
}
function b64Bytes(dataUrl){var b=dataUrl.slice(dataUrl.indexOf(',')+1);return Math.floor(b.length*3/4);}
async function addImages(files,sl,p){ // sl: 写真の枠（無ければメモ用）。p: 傷の枠で、この写真に写す問題
  var k=draftKey,d=draft,it=ST.byKey[k],i;
  // 1 行の写真は 12 枚まで（窓口も 13 枚目を受け取らない）。超える分は読み込まない
  var room=Math.max(0,PHOTO_MAX-draft.images.length-imgPending);
  if(files.length>room){toast(PHOTO_FULL,'warn');files=files.slice(0,room);if(!files.length)return;}
  imgPending+=files.length;
  for(i=0;i<files.length;i++){
    try{
      var img=await loadImageFile(files[i]);
      if(draftKey!==k||draft!==d){imgPending=Math.max(0,imgPending-(files.length-i));toast('別の商品に移動したため、写真は追加されませんでした','warn');return;}
      // 出品に使えるよう長辺 1,600 を保つ。大きすぎるときは先に画質を下げ、それでも収まらないときだけ縮める
      var data=toJpeg(img,1600,0.85),qs=[0.75,0.65,0.5],qi;
      for(qi=0;qi<qs.length&&b64Bytes(data)>MAX_PHOTO;qi++)data=toJpeg(img,1600,qs[qi]);
      if(b64Bytes(data)>MAX_PHOTO)data=toJpeg(img,1280,0.6);
      if(b64Bytes(data)>MAX_PHOTO)data=toJpeg(img,1024,0.6);
      if(sl&&Math.max(img.width,img.height)<1600)toast('写真が小さめです。カメラで撮った写真を使ってください','warn');
      var n=1,name;
      do{ name=it['PKGI']+'_'+it['行']+'_'+n+'.jpg'; n++; }while(IMG[name]||draft.images.indexOf(name)>=0);
      IMG[name]={d:data,p:false};
      draft.images.push(name);
      if(sl)draft.slots[name]=sl+(sl==='d'&&p?':'+p:'');
    }catch(e){toast('画像の読み込みに失敗しました','ng');}
    imgPending=Math.max(0,imgPending-1);
  }
  saveDraft();redraw();
}

/* ---------- クラウド（保存窓口 physcheck-save 経由。キーは端末に持たない） ---------- */
var API='https://pqfsanwopptslgdrdebn.supabase.co/functions/v1/physcheck-save';
var LS_Q='physcheck_v3_queue';
var QUEUE=[];            // 未送信の行 key
var LS_F='physcheck_v3_failed';
var FAILED=[];           // 窓口に断られた行 key（入力し直して保存するまで未完了扱い）
var _flushing=false,_flushAgain=false,_lastFlush=0;
var REV={};              // 行ごとの保存回数。送信中に保存し直されたら古い送信の成功でキューから外さない
var CLOUD_READY=false,CLOUD_OK=false,_lastCloud=0; // OK=クラウドと突き合わせ済み
var _loadNG=false;       // 直近の進捗の読み込みに失敗した（状態表示の切り替えに使う）
// 未送信がある間は、開いているだけで送り直す（30 秒後から、送れないたびに倍、最長 5 分。無くなれば止める）
var RETRY_MIN=30000,RETRY_MAX=300000,_retryMs=RETRY_MIN,_retryT=null,_retryBusy=false;
function retryPlan(){
  if(!QUEUE.length){clearTimeout(_retryT);_retryT=null;_retryMs=RETRY_MIN;return;}
  if(_retryT||_retryBusy)return;
  _retryT=setTimeout(retryRun,_retryMs);
}
function retryRun(){
  _retryT=null;
  if(_flushing||_cloudP){retryPlan();return;} // 送信中・読込中は数えずに掛け直す
  var n=QUEUE.length;_retryBusy=true;
  (CLOUD_OK?flush():cloudLoad().then(flush)).catch(function(){}).then(function(){
    _retryBusy=false;
    _retryMs=QUEUE.length>=n?Math.min(_retryMs*2,RETRY_MAX):RETRY_MIN;
    retryPlan();
  });
}
function loadQueue(){
  try{QUEUE=JSON.parse(localStorage.getItem(LS_Q)||'[]')||[];}catch(e){QUEUE=[];}
  try{FAILED=JSON.parse(localStorage.getItem(LS_F)||'[]')||[];}catch(e){FAILED=[];}
}
function saveQueue(){try{localStorage.setItem(LS_Q,JSON.stringify(QUEUE));localStorage.setItem(LS_F,JSON.stringify(FAILED));}catch(e){}}
function enqueue(k){REV[k]=(REV[k]||0)+1;var f=FAILED.indexOf(k);if(f>=0)FAILED.splice(f,1);if(QUEUE.indexOf(k)<0)QUEUE.push(k);saveQueue();updateSync();}
// 断られた行は再送キューから外し、状態表示で「保存できませんでした」を出し続ける
function markFailed(k){var q=QUEUE.indexOf(k);if(q>=0)QUEUE.splice(q,1);if(FAILED.indexOf(k)<0)FAILED.push(k);saveQueue();}
function freshPhotoName(k){
  var it=ST.byKey[k],r=ST.results[k]||{},used=(r.images||[]),free=[];
  for(var n=1;n<=99;n++){var nm=it['PKGI']+'_'+it['行']+'_'+n+'.jpg';if(!IMG[nm]&&used.indexOf(nm)<0)free.push(nm);}
  return free.length?free[Math.floor(Math.random()*free.length)]:null;
}
function pendingPhotos(k){
  var r=ST.results[k];return ((r&&r.images)||[]).filter(function(n){var e=IMG[n];return e&&e.d&&!e.p&&!e.bad;});
}
function updateSync(){
  retryPlan();
  var el=$('#sync');if(!el)return;
  if(FAILED.length){el.className='ng';el.setAttribute('data-act','openfailed');
    el.textContent='保存できませんでした '+FAILED.length+' 件（タップして再入力）';return;}
  el.removeAttribute('data-act');
  if(typeof bh!=='undefined'&&bh&&bh.busy){el.className='wait';el.textContent='ほかの端末の状況を確認中…';return;}
  var q=QUEUE.length,loading=_cloudP||!_lastCloud;
  if(_loadNG&&!loading){el.className='wait';el.textContent='ほかの人の進み具合を読み込めていません'+(q?'（未送信 '+q+' 件。通信が回復したら自動で送信します）':'（通信が回復したら自動で読み込みます）');return;}
  if(!q&&!CLOUD_OK){el.className='wait';el.textContent='最新の状態を確認中…';return;}
  if(!q){el.className='ok';el.textContent='保存済み ✓';return;}
  el.className='wait';
  el.textContent=(_flushing?'送信中… ':'')+'未送信 '+q+' 件（通信が回復したら自動で送信します）';
}
async function post(body){
  // 応答が返らないまま止まると送信中のまま固まるので、30 秒で打ち切って送れなかった扱いにする
  var ac=new AbortController(),tm=setTimeout(function(){ac.abort();},30000);
  try{
    var r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:ac.signal});
    try{await r.text();}catch(e){}
    return r.status;
  }catch(e){return 0;}
  finally{clearTimeout(tm);}
}
function rowData(k){
  return Object.assign({},ST.results[k]);
}
async function flush(){
  if(_flushing){_flushAgain=true;return;}
  if(!QUEUE.length||navigator.onLine===false){updateSync();return;}
  if(!CLOUD_OK||_cloudP){updateSync();return;} // ほかの端末の進捗を取り込めるまでは送らない（取り込み成功後に cloudLoad().then(flush) で送る）
  _flushing=true;_lastFlush=Date.now();updateSync();
  try{
    var keys=QUEUE.slice(),stop=false;
    for(var i=0;i<keys.length&&!stop;i++){
      var k=keys[i],rv=REV[k],ph=pendingPhotos(k),badPhoto=false,row=ST.results[k];
      // 窓口は 2KB を超える行を受け取らない。送る前に止めて、入力し直してもらう
      if(row&&rowBytes(rowData(k))>ROW_MAX){markFailed(k);toast('記録が大きすぎて保存できませんでした。入力し直してください','ng');updateSync();continue;}
      var lost=((row&&row.images)||[]).filter(function(n){var e=IMG[n];return !e||(!e.p&&!e.d);});
      if(lost.length){
        row.images=row.images.filter(function(n){return lost.indexOf(n)<0;});
        lost.forEach(function(n){delete IMG[n];if(row.slots)delete row.slots[n];});
        markFailed(k);toast('写真が見つかりません。撮り直して保存してください','ng');persist(true);updateSync();continue;
      }
      for(var j=0;j<ph.length;j++){
        var e=IMG[ph[j]],st=await post({op:'photo',name:ph[j],jpegBase64:e.d.split(',')[1]});
        // 同じ名前の写真がすでにある（別の端末が同じ番号で撮った等）→ 空いている番号に付け替えて送り直す
        for(var t=0;st===409&&t<3;t++){
          var nn=freshPhotoName(k);if(!nn)break;
          IMG[nn]=e;delete IMG[ph[j]];
          var ren=function(n){return n===ph[j]?nn:n;},cr=ST.results[k];
          row.images=row.images.map(ren);if(cr&&cr!==row&&cr.images)cr.images=cr.images.map(ren); // 送信中に保存し直された行も付け替える
          [row,cr].forEach(function(o){if(o&&o.slots&&o.slots[ph[j]]){o.slots[nn]=o.slots[ph[j]];delete o.slots[ph[j]];}}); // 写真の枠も新しい名前へ
          ph[j]=nn;persist(true);
          st=await post({op:'photo',name:nn,jpegBase64:e.d.split(',')[1]});
        }
        if(st===200){e.p=true;e.d='';}
        else if(st===400){
          // 断られた写真は行から外す（送っていない写真名をクラウドに残さない）。行は撮り直すまで送らない
          var r=ST.results[k];if(r&&r.images)r.images=r.images.filter(function(n){return n!==ph[j];});
          if(r&&r.slots)delete r.slots[ph[j]];
          delete IMG[ph[j]];badPhoto=true;
        }
        else if(st===429){
          // この商品の写真は窓口の上限に達している。その写真は付けずに、残りの記録だけ送る
          var r9=ST.results[k];if(r9&&r9.images)r9.images=r9.images.filter(function(n){return n!==ph[j];});
          if(r9&&r9.slots)delete r9.slots[ph[j]];
          delete IMG[ph[j]];persist(true);toast(PHOTO_FULL,'warn');
        }
        else {stop=true;break;}
      }
      if(stop)break;
      if(badPhoto&&REV[k]!==rv){_flushAgain=true;continue;} // 送信中に保存し直された。新しい内容を次の周回で送る
      if(badPhoto){markFailed(k);toast('写真を送れませんでした。撮り直して保存してください','ng');persist(true);updateSync();continue;}
      if(REV[k]!==rv){_flushAgain=true;continue;} // 写真の送信中に保存し直された。新しい写真を送ってから行を送る
      var rs=await post({op:'row',key:k,data:rowData(k)});
      if(REV[k]!==rv){_flushAgain=true;}  // 送信中に保存し直された。新しい内容を次の周回で送る
      else if(rs===200){QUEUE.splice(QUEUE.indexOf(k),1);}
      else if(rs===400){markFailed(k);toast('保存できませんでした。入力し直してください','ng');}
      else stop=true;
      saveQueue();persist(true);updateSync();
    }
    // 送れなかった間にほかの端末が同じ行を保存したかもしれない。進捗を取り込み直すまで再送しない
    if(stop)CLOUD_OK=false;
  }finally{
    _flushing=false;updateSync();
    if(_flushAgain){_flushAgain=false;setTimeout(flush,500);}
  }
}
function mergeResults(local,cloud){
  var out={},k;
  for(k in cloud)out[k]=cloud[k];
  for(k in local){
    var c=out[k];
    if(!c){out[k]=local[k];continue;}
    var lt=Date.parse(local[k].checkedAt||'')||0,ct=Date.parse(c.checkedAt||'')||0;
    out[k]=lt>=ct?local[k]:c;
  }
  return out;
}
// 取り込みは同時に 1 本だけ。取り込み中は送信も保存の押下も待たせる
var _cloudP=null;
function cloudLoad(){
  if(!_cloudP){_cloudP=_cloudLoad().finally(function(){_cloudP=null;updateSync();});updateSync();}
  return _cloudP;
}
async function _cloudLoad(){
  _lastCloud=Date.now();
  // 電波が弱いと応答が返らないまま止まるので、15 秒で打ち切って読込失敗として扱う
  var ac=new AbortController(),tm=setTimeout(function(){ac.abort();},15000);
  try{
    var r=await fetch(API+'?op=progress',{signal:ac.signal});
    if(!r.ok){CLOUD_OK=false;_loadNG=true;return false;}
    var p=await r.json();
    if(!p||!p.results||typeof p.results!=='object'){CLOUD_OK=false;_loadNG=true;return false;}
    var cur=ST.view==='card'?ST.cardKey:null,before=cur&&ST.results[cur];
    Object.keys(ST.results).forEach(function(k){
      // v2 から引き継いだ答えや未送信の答え（クラウドに無い・手元の方が新しい）を送信キューへ
      var c=p.results[k],lt=Date.parse(ST.results[k].checkedAt||'')||0,ct=c?(Date.parse(c.checkedAt||'')||0):-1;
      if(ST.results[k].checkedAt&&lt>ct&&ST.byKey[k]&&FAILED.indexOf(k)<0&&QUEUE.indexOf(k)<0)QUEUE.push(k);
    });
    saveQueue();CLOUD_OK=true;_loadNG=false;
    var old=ST.results;
    ST.results=mergeResults(old,p.results);
    // 手元で断られた行でも、クラウドに新しい答えがあればそちらを正とする
    FAILED=FAILED.filter(function(k){return ST.results[k]===old[k];});saveQueue();
    Object.keys(p.results).forEach(function(k){
      // クラウドの行が勝ったら、同じ名前で手元に残る未送信の写真は古い行のものなので捨てる
      var won=ST.results[k]===p.results[k];
      if(won&&old[k])(old[k].images||[]).forEach(function(n){ if(IMG[n]&&!IMG[n].p&&(p.results[k].images||[]).indexOf(n)<0)delete IMG[n]; });
      ((p.results[k]&&p.results[k].images)||[]).forEach(function(n){ if(!IMG[n]||(won&&!IMG[n].p))IMG[n]={d:'',p:true}; });
    });
    persist(true);
    // 「担当者に回す」の押し直しが消えないよう、箱ごと確認の画面は描き直さない
    if(ST.view==='boxhelp'){}
    else if(ST.view!=='card')render();
    else if(cur&&ST.cardKey===cur&&ST.results[cur]!==before){
      // 開いているカードより新しい答えがクラウドにあった。古い下書きで上書きしないよう開き直す
      draftKey=null;render();toast('ほかの端末で保存された内容を表示しました','warn');
    }
    return true;
  }catch(e){CLOUD_OK=false;_loadNG=true;return false;}
  finally{clearTimeout(tm);CLOUD_READY=true;updateSync();}
}

function colorParts(s){ // 「青×1・黄×2」→ [{c:'青',n:1},{c:'黄',n:2}]。1 色なら [{c:'青',n:null}]
  if(!s)return [];
  var ps=String(s).split('・').map(function(x){
    x=x.trim();var m=x.match(/^(.+?)×(\d+)$/);return m?{c:m[1],n:+m[2]}:{c:x,n:null};
  }).filter(function(p){return p.c;});
  // 「×数」の無い部分が混じるなら、分けずに全体を 1 つの色名として扱う（「黒・白」のような 2 色づかいの名前を 2 色に割らない）
  if(ps.length>=2&&ps.some(function(p){return p.n==null;}))return [{c:String(s).trim(),n:null}];
  return ps;
}
function colorAdd(ps,v,qty){ // 色を 1 つ足す。いまある 1 色には、残りの数を入れる
  if(ps.length===1&&ps[0].n==null)ps[0].n=Math.max(1,qty-1);
  ps.push({c:v,n:ps.length?1:null});
  return ps;
}
function colorNorm(color,note){ // ボタンに無い色名は「その他」にし、元の色名をメモへ「色: 元の色名」で移す（元の色名は消さない）
  var out=[],oth=null;note=String(note||'');
  colorParts(color).forEach(function(p){
    if(p.c!=='その他'&&COLORS.indexOf(p.c)>=0){out.push(p);return;}
    if(p.c!=='その他'&&note.indexOf('色: '+p.c)<0)note+=(note?'\n':'')+'色: '+p.c;
    if(oth)oth.n=(oth.n||0)+(p.n||0);else{oth={c:'その他',n:p.n};out.push(oth);}
  });
  if(out.length===1)out[0].n=null;
  return {color:colorJoin(out),note:note};
}
function colorFix(){var f=colorNorm(draft.color,draft.note);draft.color=f.color;draft.note=f.note;}
function colorJoin(ps){
  if(ps.length<2)return ps.length?ps[0].c:'';
  return ps.map(function(p){return p.c+'×'+(p.n==null?0:p.n);}).join('・');
}
function colorSum(ps){return ps.reduce(function(a,p){return a+(p.n||0);},0);}
function setColorParts(ps){ // 2 色以上なら合計を現物数量に入れる
  draft.color=colorJoin(ps);
  if(ps.length>=2)draft.qty=colorSum(ps); // 色を選んだだけでは「触った」にしない
  // 色を触ったら「数量を確かめてください」などの案内は消す
  ['qty','color'].forEach(function(n){if(typeof errFields[n]==='string')delete errFields[n];});
}
function normCode(s){ // 小文字・空白・ハイフン抜け・桁不足を CSV の表記（BU-/PKG-/PKGI- + 8桁）に揃える
  s=String(s).toUpperCase().replace(/\s+/g,'');
  var m=s.match(/^(BU|PKGI|PKG)-?(\d+)$/);
  if(!m)return s;
  var d=m[2];while(d.length<8)d='0'+d;
  return m[1]+'-'+d;
}
function findCode(items,raw){ // 読み取った番号を箱 → 商品 → 袋の順に作業リストと照らす
  var code=normCode(raw),by=function(col){return items.filter(function(it){return it[col]===code;});};
  var box=by('箱'),one=box.length?[]:by('PKGI');
  return {code:code,box:box,one:one,bag:(box.length||one.length)?[]:by('袋')};
}

  else if(act==='later'){if(commitOrShow('later')){toast('保留にしました','warn');gotoNext();}}
  else if(act==='prev'){
    var it=ST.byKey[draftKey],bb=ST.boxMap[it['箱']],ks=boxRows(bb).map(function(x){return x._key;});
    var idx=ks.indexOf(draftKey);
    if(idx>0){ST.cardKey=ks[idx-1];draftKey=null;render();}
  }
  else if(act==='scan'){openScan();}
  else if(act==='tohome'){ST.view='home';ST.boxId=null;draftKey=null;render();}
  else if(act==='flushnow'){closeSheet();if(CLOUD_OK)flush();else cloudLoad().then(flush);}
  else if(act==='openfailed'){if(FAILED.length&&ST.byKey[FAILED[0]]){ST.cardKey=FAILED[0];draftKey=null;ST.view='card';render();}}
  else if(act==='introok'){try{localStorage.setItem(LS_INTRO,'1');}catch(e){}var ov=$('#intro');if(ov)ov.remove();}
  else if(act==='reload'){location.reload();}
  else if(act==='exp'){closeSheet();cloudLoad().then(function(ok){
    // ほかの端末の最新を取り込んでから書き出す。取り込めなければ書き出さない
    if(ok)exportCSV(); else toast('通信が不安定なため最新の状態を確認できませんでした。電波の良い場所で再度お試しください','warn');
  });}
  else if(act==='typecode'){closeSheet();openSearch('箱番号を入力して検索してください');}
  else if(act==='closesheet'){closeSheet();}
});
// 送れなかった分は、次の操作時（間引き 20 秒）とオンライン復帰時に再送する。進捗の取り直しは 60 秒おき
document.addEventListener('click',function(e){
  // 読込に失敗していたら 20 秒おき、ほかの端末の進捗は 60 秒おきに取り込む
  if(_cloudP||(!CLOUD_OK&&Date.now()-_lastCloud>20000)||(CLOUD_OK&&!_flushing&&Date.now()-_lastCloud>60000)){
    var t=e.target.closest&&e.target.closest('[data-act]'),act=t&&t.getAttribute('data-act');
    // 「担当者に回す」は押すたびに自分で取り直すので、ここでは待たせない
    if(act==='save'||act==='absent'||act==='later'||(act==='pres'&&t.getAttribute('data-v')==='no')){
      // 保存の押下は取り込み終わってから押し直す（古い下書きで新しい答えを上書きしない）
      e.stopPropagation();e.preventDefault();
      var dk=draftKey,d=draft;
      cloudLoad().then(function(ok){
        // 最新を取り込めなかったときは押し直さない（ほかの端末の答えを古い下書きで上書きしない）
        if(!ok){toast('通信が不安定なため最新の状態を確認できませんでした。もう一度押すと、この端末に一時保存します','warn');return;}
        if(draftKey===dk&&draft===d&&document.contains(t))t.click(); else flush();
      });
    }
    else cloudLoad().then(flush);
  }
  else if(QUEUE.length&&Date.now()-_lastFlush>20000)flush();
},true);
// 電波が戻ったら、送る前に必ずほかの端末の進捗を取り込む（途切れている間の更新を上書きしない）
window.addEventListener('online',function(){cloudLoad().then(flush);});
document.addEventListener('toggle',function(e){if(e.target.classList&&e.target.classList.contains('flt'))ST.fltOpen=e.target.open;},true);
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='ft'){ST.filters.task=t.value;updateHome();return;}
  if(t.getAttribute&&t.getAttribute('data-act')==='imgadd'&&t.files&&t.files.length){addImages(Array.prototype.slice.call(t.files),t.getAttribute('data-slot')||'',t.getAttribute('data-p')||'');t.value='';}
});
var _qT=null;
document.addEventListener('input',function(e){
  var t=e.target,k=t.getAttribute&&t.getAttribute('data-k');
  if(t.id==='q'){
    clearTimeout(_qT);_qT=setTimeout(function(){var v=t.value.trim(),nc=normCode(v);ST.filters.q=/^(BU|PKGI|PKG)-\d{8}$/.test(nc)?nc:v;updateHome();},220);return;
  }
  if(k==='qty'&&draft&&colorParts(draft.color).length>=2)return;
  var cq=t.getAttribute&&t.getAttribute('data-cq');
  if(cq&&draft){
    var ps=colorParts(draft.color);ps.forEach(function(p){if(p.c===cq)p.n=Math.max(0,num(t.value,0));});
    setColorParts(ps);qtyTouch();saveDraft();
    var qi=document.querySelector('input[data-k="qty"]');if(qi){qi.value=draft.qty;var qf=qi.closest('.fld');if(qf)qf.classList.remove('err');}
    var cf=t.closest('.fld');if(cf)cf.classList.remove('err');
    return;
  }
  if(!k||!draft)return;
  draft[k]=(k==='qty')?num(t.value,0):t.value;
  if(k==='qty')qtyTouch();
  saveDraft();
  var f=t.closest('.fld');if(f)f.classList.remove('err');
});
$('#gear').addEventListener('click',openSheet);
$('#hscan').addEventListener('click',openScan);
$('#sheet').addEventListener('click',function(e){if(e.target.id==='sheet')closeSheet();});
$('#back').addEventListener('click',function(){
  if(ST.view==='card'&&issKey===ST.cardKey){ST.view='issues';draftKey=null;}
  else if(ST.view==='card'){ST.view='box';ST.boxId=ST.byKey[ST.cardKey]['箱'];draftKey=null;}
  else if(ST.view==='box'){ST.view='home';ST.boxId=null;}
  else if(ST.view==='issues'){ST.view='home';}
  else if(ST.view==='boxhelp'){bhLeave();}
  render();
});

/* ---------- 起動 ---------- */
function applyCSV(text){
  ST.items=csvToItems(text);
  buildIndex();ST.loaded=true;ST.view='home';draftKey=null;render();
}
function fallbackUI(){
  $('#app').innerHTML='<div class="prog"><div class="t">作業リストを読み込めませんでした</div>'+
    '<div class="hint">電波の良い場所で、下のボタンを押してください。</div></div>'+
    '<div class="btns"><button class="btn pri" data-act="reload">再読み込み</button></div>';
}
var LS_INTRO='physcheck_v4_intro';
function showIntro(){
  try{if(localStorage.getItem(LS_INTRO))return;}catch(e){}
  var d=document.createElement('div');d.className='intro';d.id='intro';
  d.innerHTML='<div class="in"><ol><li>箱のバーコードを読み取る</li><li>質問に答えて、写真を撮る（正面と、裏・ラベル）</li><li>箱内の商品がすべて終わったら次の箱へ</li></ol>'+
    '<button class="btn pri" data-act="introok" style="width:100%">はじめる</button></div>';
  document.body.appendChild(d);
}
(function init(){
  loadLS();loadQueue();updateSync();
  fetch(CSV_URL+'?t='+Date.now()).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.arrayBuffer();
  }).then(function(buf){
    applyCSV(new TextDecoder('utf-8').decode(buf));
    showIntro();cloudLoad().then(flush);
    // 箱の中身の一覧は補助。読めなければ出さないだけで、確認作業は今まで通りできる
    fetch(CTX_URL+'?t='+Date.now()).then(function(r){return r.ok?r.json():null;}).then(function(j){
      if(!j||typeof j!=='object')return;
      CTX=j;
      // 開いているカードの数量がまだ初期値なら、合計の案内に合わせて出し直す（個別の数のまま合計として保存しない）
      if(draftKey&&draft&&draft.absent!==true){
        if(!qtyHand&&qtyStale(draftKey))qtyAuto=true; // 一覧が届く前に開いた、更新前の下書きの数量
        if(qtyAuto)qtyReset();
      }
      if(ST.view==='card')renderCard(true); else render();
    }).catch(function(){});
  }).catch(function(){fallbackUI();});
})();

window.PC={ST:ST,stats:stats,isDone:isDone,buildExportCSV:buildExportCSV,IMG:IMG,ctx:function(){return CTX;}};
</script>
</body>

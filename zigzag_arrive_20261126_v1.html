<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>届いた荷物の確認</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--line:#ddd8ce;--text:#24231f;--sub:#6d6a62;--main:#176b54;--main-dark:#0f503e;--soft:#e8f2ee;--warn:#9a5c00;--danger:#b12b26}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation}
.status{position:sticky;top:0;z-index:20;width:100%;min-height:46px;padding:12px 14px;background:#203b34;color:#fff;text-align:center;font-size:14px;font-weight:700;padding-top:calc(12px + env(safe-area-inset-top))}
.status.warn{background:#765019}.status.bad{background:#8a2925}
main{width:100%;max-width:560px;margin:0 auto;padding:12px}
.primary{display:block;width:100%;min-height:84px;border:0;border-radius:14px;background:var(--main);color:#fff;font-size:26px;font-weight:800}
.primary:active{background:var(--main-dark)}.primary:disabled{background:#a5aaa6}
.total{margin:18px 0 6px;text-align:center;font-size:20px;font-weight:800}
.total b{display:block;font-size:48px;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.line{margin:6px 0;text-align:center;font-weight:700}
.band{margin:14px 0;padding:16px 14px;border:4px solid #203b34;border-radius:4px;background:#fff;color:#203b34;font-size:24px;font-weight:800;text-align:center;overflow-wrap:anywhere}
.band[hidden]{display:none}.band.ok{border-color:var(--main);color:var(--main)}.band.count{border-color:var(--warn);color:var(--warn)}.band.photo,.band.error{border-color:var(--danger);color:var(--danger)}
.intro{margin:14px 0;padding:14px;border:3px solid var(--main);border-radius:14px;background:#fff;font-size:18px;font-weight:700}
.intro p{margin:2px 0}.intro[hidden]{display:none}
.text-link{display:inline-flex;min-height:44px;align-items:center;border:0;background:none;padding:4px 0;color:var(--main);text-decoration:underline;font-size:15px}
.item{margin:14px 0;padding:14px;border:3px solid var(--text);border-radius:14px;background:#fff}
.item .nm{font-size:20px;font-weight:800;overflow-wrap:anywhere}
.item .want{margin:2px 0 10px;font-size:18px;font-weight:700}
.nums{display:flex;flex-wrap:wrap;gap:8px}
.nums button{flex:0 0 calc(25% - 6px);min-height:64px;border:3px solid var(--line);border-radius:12px;background:#fff;font-size:26px;font-weight:800}
.nums button.listq{border-color:var(--main);color:var(--main)}
.nums button.on{border-color:var(--text);background:var(--text);color:#fff}
.nums button.other{flex:1 0 100%}
.step{display:flex;align-items:center;gap:6px}.step .big{flex:1;min-width:0;text-align:center;font-size:44px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}.step button{flex:0 0 52px;min-height:64px;padding:0;border:3px solid var(--text);border-radius:12px;background:#fff;font-size:24px;font-weight:800}.step-back{margin-top:6px}
.shots{display:flex;gap:8px;margin:12px 0}.shots img{width:96px;height:96px;object-fit:cover;border-radius:12px;background:#ece9e2}.shots[hidden]{display:none}
details{margin-top:18px;border-top:3px solid var(--line);padding-top:6px}summary{min-height:48px;padding:12px 0;color:var(--main);font-size:20px;font-weight:800;cursor:pointer}
.menu-btn{display:block;width:100%;min-height:56px;margin:8px 0;border:3px solid var(--text);border-radius:12px;background:#fff;font-size:17px;font-weight:700}
.menu-btn:disabled{border-color:var(--line);color:#a5aaa6}
.scan-layer{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#0d1411;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.scan-layer[hidden]{display:none}.scan-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.scan-head h2{margin:0;font-size:18px}.scan-head button{min-width:44px;min-height:44px;border:0;background:none;color:#fff;text-decoration:underline}
#reader-wrap[hidden],#scan-tip[hidden]{display:none}#reader-wrap{position:relative;flex:1;min-height:160px;overflow:hidden;border-radius:14px;background:#000;margin-top:12px}#scan-video{display:block;width:100%;height:100%;object-fit:cover}.scan-guide{position:absolute;left:5%;right:5%;top:32%;height:36%;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}.scan-layer p{text-align:center;font-size:14px}
.scan-tools{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:10px;align-items:center}.scan-tools[hidden]{display:none}.scan-tools button{min-width:64px;height:48px;border:0;border-radius:10px;background:rgba(0,0,0,.5);color:#fff;font-size:15px;font-weight:700}.scan-tools button[hidden],.scan-tools input[hidden]{display:none}.scan-tools button.on{background:#fff;color:#14231e}.scan-tools input{flex:1}
.scan-shot{min-height:48px;border:3px solid #6d7c76;border-radius:12px;background:transparent;color:#fff;font-size:15px;font-weight:700}.scan-shot[hidden]{display:none}
.scan-link{min-height:44px;border:0;background:none;color:#fff;text-decoration:underline;font-size:15px}.scan-link[hidden]{display:none}
.manual{display:grid;gap:8px}.manual[hidden]{display:none}.manual input{display:block;width:100%;padding:12px;border:0;border-radius:10px;background:#fff;color:#14231e;-webkit-text-fill-color:#14231e;font-size:20px;letter-spacing:.05em}.manual-error{margin:0;color:#ffb4ac;font-size:14px}.manual-go{min-height:52px;border:0;border-radius:12px;background:#fff;color:#14231e;font-size:17px;font-weight:800}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="status" class="status" role="status" aria-live="polite">準備しています</div>
<main>
  <button id="primary" class="primary" type="button" disabled>ラベルを読む</button>
  <div id="total" class="total"></div>
  <p id="closed-line" class="line" hidden>確認は終了しています。読み取りは続けられます</p>
  <div id="band" class="band" role="status" aria-live="polite" hidden></div>
  <div id="items"></div>
  <div id="shots" class="shots" hidden></div>
  <section id="intro" class="intro" hidden>
    <p>1. ラベルを読む</p>
    <p>2. 数を聞かれたら開けて数える</p>
    <p>3. おかしい荷物は写真</p>
    <button id="intro-close" class="text-link" type="button">閉じる</button>
  </section>
  <details id="more"><summary>⋯</summary>
    <button id="issue-btn" class="menu-btn" type="button" disabled>破れ・中身が違う（写真を撮る）</button>
    <button id="close-btn" class="menu-btn" type="button" hidden>この回の確認を終える</button>
  </details>
</main>
<input id="photo-input" class="sr-only" type="file" accept="image/*" capture="environment">
<section id="scan-layer" class="scan-layer" hidden aria-modal="true" role="dialog" aria-label="ラベルを読む">
  <div class="scan-head"><h2>ラベルを枠に入れてください</h2><button id="scan-close" type="button">閉じる</button></div>
  <div id="reader-wrap"><video id="scan-video" playsinline muted autoplay></video><div class="scan-guide"></div><div id="scan-tools" class="scan-tools" hidden><button id="scan-torch" type="button" aria-label="ライト" hidden>ライト</button><input id="scan-zoom" type="range" aria-label="ズーム" hidden></div></div>
  <div id="scan-band" class="band" hidden></div>
  <p id="scan-tip">明るい場所で、ラベル全体を枠に入れてください</p>
  <button id="scan-shot" class="scan-shot" type="button">撮影して読み取る</button>
  <input id="scan-shot-input" class="sr-only" type="file" accept="image/*" capture="environment">
  <button id="manual-open" class="scan-link" type="button">読めないときは番号を入力</button>
  <form id="manual-form" class="manual" hidden novalidate>
    <input id="manual-no" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="64" placeholder="ラベルの番号" aria-label="ラベルの番号">
    <p id="manual-error" class="manual-error" role="alert"></p>
    <button id="manual-go" type="submit" class="manual-go">この番号で進む</button>
  </form>
</section>
<script src="vendor/barcode-detector_3.2.2/ponyfill.js"></script>
<script>
'use strict';
var API='https://pqfsanwopptslgdrdebn.supabase.co/functions/v1/zigzag-shoot';
var DB_NAME=isMockMode(location.search)?'zigzag_arrive_mock_v1':'zigzag_arrive_v1';
var DB_STORE='pending';
var MAX_SHOTS=3;
var SCAN_FORMATS=['code_128','code_39','code_93','ean_13','ean_8','itf','codabar','qr_code'];
var _cam=null,_detectorP=null,_scanSession=0,_flushing=false,_lastRead={code:'',at:0};
var params=new URLSearchParams(location.search);
var worker=params.get('w')||'';
var mock=isMockMode(location.search);
var workerValid=mock||/^[A-Za-z0-9]{8}$/.test(worker);
var BAD_URL='この URL は使えません。担当者に連絡してください';
var view={lot:null,total:0,arrived:0,loaded:false,band:null,cur:null,photo:null,last:null,busy:false,sending:false};
var PENDING_KEY=mock?'zigzag_arrive_confirm_mock':'zigzag_arrive_confirm';
var _retryTimer=0,_retryStep=0;
var _mockArrived={};

function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function isMockMode(search){return new URLSearchParams(search).get('mock')==='1';}
// 読み取った番号をそろえる（全角を半角、大文字、空白なし）
function normArrive(s){
  s=String(s==null?'':s);if(s.normalize)s=s.normalize('NFKC');
  s=s.toUpperCase().replace(/\s+/g,'');
  return s.length>64?'':s;
}
// 結果の文言と、そのあとの動き（keep=読み取りを続ける）
function resultView(result,needCount){
  if(result==='arrived'&&!needCount)return {kind:'ok',text:'OK 次の荷物へ',keep:true};
  if(result==='arrived')return {kind:'count',text:'開けて数を数えてください',keep:false};
  if(result==='not_listed')return {kind:'photo',text:'リストにない荷物です。写真を撮ってください',keep:false};
  if(result==='issue')return {kind:'photo',text:'要確認の荷物です。写真を撮ってください',keep:false};
  if(result==='repeat')return {kind:'repeat',text:'この荷物は確認済みです',keep:true};
  return {kind:'error',text:'読み取れませんでした。もう一度読んでください',keep:true};
}
// 数のボタン。0 からリストの数+2 まで。多いときは 0 とリストの数の前後だけ
function countOptions(qty){
  qty=Math.max(0,Math.floor(Number(qty)||0));
  var top=qty+2,out=[],from=qty>10?qty-5:0,i;
  if(from>0)out.push(0);
  for(i=from;i<=top;i++)out.push(i);
  return out;
}
function allCounted(items,counts){
  return Array.isArray(items)&&items.length>0&&items.every(function(it){return typeof counts[it.key]==='number';});
}
// 数の増減（0〜999の整数）
function stepCount(n,d){n=Math.floor(Number(n)||0)+Math.floor(Number(d)||0);return Math.max(0,Math.min(999,n));}
// 処理中の印。送信中・数える画面・写真の画面が出ているあいだは次の読み取りを受け付けない
function isBusy(v){return !!(v.busy||v.sending||(v.cur&&!v.cur.saved)||v.photo);}
// 再送の間隔（5秒→15秒→30秒→60秒が上限）
function retryDelay(step){var steps=[5000,15000,30000,60000];return steps[Math.max(0,Math.min(Math.floor(Number(step)||0),steps.length-1))];}
// 送り直した答えが確認を求めているとき、残っている確認の記録を返す
function pendingFromReply(row,value){
  if(!row||row.action!=='arrive'||!value)return null;
  var code=row.code||'';
  if(value.result==='arrived'&&value.need_count&&Array.isArray(value.items)&&value.items.length)return {kind:'count',client_id:row.client_id,items:value.items,code:code};
  if(value.result==='not_listed')return {kind:'photo',client_id:row.client_id,issue:false,code:code};
  if(value.result==='issue')return {kind:'photo',client_id:row.client_id,issue:true,code:code};
  return null;
}
// 確認を再開するとき、どの荷物かを番号で示す
function withCode(text,code){return code?'番号 '+code+' の荷物です。'+text:text;}
function addPending(list,rec){return removePending(list,rec.client_id,rec.kind).concat([rec]);}
function removePending(list,clientId,kind){return list.filter(function(r){return !(r&&r.client_id===clientId&&r.kind===kind);});}
function fmt(n){return Number(n||0).toLocaleString('en-US');}
function queueId(body){return body.action+(body.issue?'!':'')+':'+body.client_id;}
function dedupeQueue(items){
  var seen={},out=[];
  items.forEach(function(item){if(!item||!item.qid)return;if(seen[item.qid]===undefined){seen[item.qid]=out.length;out.push(item);}else out[seen[item.qid]]=item;});
  return out;
}
async function flushQueueList(items,send){
  var queue=dedupeQueue(items),remaining=[];
  for(var i=0;i<queue.length;i++){
    try{await send(queue[i]);}catch(error){remaining=remaining.concat(queue.slice(i));break;}
  }
  return remaining;
}
function makeUuid(){
  if(crypto.randomUUID)return crypto.randomUUID();
  var bytes=new Uint8Array(16);crypto.getRandomValues(bytes);bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;
  return Array.from(bytes,function(b){return b.toString(16).padStart(2,'0');}).join('').replace(/^(........)(....)(....)(....)/,'$1-$2-$3-$4-');
}
function safeStorageGet(key,fallback){try{var value=localStorage.getItem(key);return value===null?fallback:value;}catch(error){return fallback;}}
function safeStorageSet(key,value){try{localStorage.setItem(key,value);}catch(error){}}
function pendingLoad(){try{var v=JSON.parse(safeStorageGet(PENDING_KEY,'[]'));return Array.isArray(v)?v.filter(Boolean):[];}catch(error){return [];}}
function pendingSave(list){safeStorageSet(PENDING_KEY,JSON.stringify(list));}
function pendingDone(clientId,kind){pendingSave(removePending(pendingLoad(),clientId,kind));}

function mockItems(code){
  if(code==='A001')return [{key:'k1',name:'ダミー商品A',quantity:1}];
  if(code==='A002')return [{key:'k2',name:'ダミー商品B',quantity:3},{key:'k3',name:'ダミー商品C',quantity:1}];
  if(code==='A003')return [{key:'k4',name:'ダミー商品D',quantity:1}];
  return null;
}
async function request(body){
  if(mock){
    await new Promise(function(resolve){setTimeout(resolve,150);});
    if(body.action==='arrive_status')return {lot:{collected_on:'2026-11-25',status:'checking'},total:5,arrived:Object.keys(_mockArrived).length,can_close:true};
    if(body.action==='arrive'){
      var items=mockItems(body.code);
      if(!items)return {client_id:body.client_id,result:'not_listed',need_count:false};
      if(_mockArrived[body.code]&&_mockArrived[body.code]!==body.client_id)return {client_id:body.client_id,result:'repeat',need_count:false};
      _mockArrived[body.code]=body.client_id;
      var multi=items.some(function(it){return it.quantity>=2;});
      return multi?{client_id:body.client_id,result:'arrived',need_count:true,items:items}:{client_id:body.client_id,result:'arrived',need_count:false};
    }
    if(body.action==='arrive_close')return {ok:true,closed:true};
    return {ok:true,result:'arrived'};
  }
  var response=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  var value={};try{value=await response.json();}catch(error){}
  if(!response.ok){var e=new Error(value.error||'request_failed');e.status=response.status;throw e;}
  return value;
}

function openQueue(){
  return new Promise(function(resolve,reject){
    var call=indexedDB.open(DB_NAME,1);
    call.onupgradeneeded=function(){var db=call.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE,{keyPath:'qid'});};
    call.onsuccess=function(){resolve(call.result);};call.onerror=function(){reject(call.error);};
  });
}
async function queuePut(body){var row=Object.assign({qid:queueId(body)},body);var db=await openQueue();await new Promise(function(resolve,reject){var tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(row);tx.oncomplete=resolve;tx.onerror=function(){reject(tx.error);};});db.close();}
async function queueAll(){var db=await openQueue();var rows=await new Promise(function(resolve,reject){var call=db.transaction(DB_STORE).objectStore(DB_STORE).getAll();call.onsuccess=function(){resolve(call.result||[]);};call.onerror=function(){reject(call.error);};});db.close();return dedupeQueue(rows);}
async function queueDelete(id){var db=await openQueue();await new Promise(function(resolve,reject){var tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=function(){reject(tx.error);};});db.close();}
async function queueCount(){try{return (await queueAll()).length;}catch(error){return 0;}}
// 写真の枚数の上限（photo_limit）は送り直しても通らないので、送信待ちに入れない
function retryable(error){return !error.status||error.status>=500||(error.status===429&&error.message!=='photo_limit')||error.status===408;}
// 送る。電波が無い・窓口の不調なら送信待ちに入れる。返り値は窓口の答え（送信待ちなら null）
async function sendOrQueue(body){
  try{return await request(body);}
  catch(error){
    if(error.status===403)workerValid=false;
    if(!retryable(error))throw error;
    try{await queuePut(body);}catch(e2){throw error;}
    scheduleRetry();
    return null;
  }
}
function scheduleRetry(){
  if(_retryTimer)return;
  _retryTimer=setTimeout(function(){_retryTimer=0;flushQueue();},retryDelay(_retryStep));
}
async function flushQueue(){
  if(_flushing||navigator.onLine===false||!workerValid)return;
  _flushing=true;var failed=false;
  try{
    var rows=await queueAll();
    var rest=await flushQueueList(rows,async function(row){
      var body=Object.assign({},row);delete body.qid;
      try{
        var value=await request(body);var rec=pendingFromReply(row,value);if(rec)pendingSave(addPending(pendingLoad(),rec));
        // 送信待ちだった数・写真を送れたら、残っている確認を消す
        if(row.action==='arrive_count')pendingDone(row.client_id,'count');
        if(row.action==='arrive_photo')pendingDone(row.client_id,'photo');
      }
      catch(error){
        // 権限が無くなったときは消さずに止め、使えるようになってから送り直す
        if(error.status===403){workerValid=false;throw error;}
        if(retryable(error))throw error;
        // 写真がもう上限まである荷物は、撮り直しを求めない
        if(error.message==='photo_limit')pendingDone(row.client_id,'photo');
      }
      await queueDelete(row.qid);
    });
    failed=rest.length>0;
  }catch(error){failed=true;}finally{
    _flushing=false;
    if(!failed)_retryStep=0;
    if(workerValid&&(failed||(await queueCount())>0)){if(failed)_retryStep++;scheduleRetry();}
    await refreshStatus();updateStatus();
  }
}
async function updateStatus(){
  var el=document.getElementById('status');
  if(!workerValid){el.className='status bad';el.textContent=BAD_URL;return;}
  var left=pendingLoad().length;
  if(left){el.className='status warn';el.textContent='確認が '+left+' 件残っています';return;}
  var pending=await queueCount();
  if(!workerValid){el.className='status bad';el.textContent=BAD_URL;return;}
  if(pending){el.className='status warn';el.textContent='送信待ち '+pending+' 件（電波が戻ると送ります）';return;}
  el.className='status';el.textContent='保存済み ✓';
}
async function refreshStatus(){
  if(!workerValid)return;
  try{var v=await request({action:'arrive_status',w:worker});view.lot=v.lot||null;view.total=Number(v.total)||0;view.arrived=Number(v.arrived)||0;view.canClose=v.can_close===true;view.loaded=true;_statusRetry=0;}
  catch(error){
    if(error.status===403){workerValid=false;updateStatus();}
    else if(error.status===409)view.lot=null;
    // 一時的な失敗は、回数を区切って少しずつ間を空けて取り直す
    else if(_statusRetry<STATUS_RETRY_MAX){_statusRetry++;clearTimeout(_statusTimer);_statusTimer=setTimeout(refreshStatus,Math.min(30000,3000*_statusRetry));}
  }
  render();
}
var STATUS_RETRY_MAX=10,_statusRetry=0,_statusTimer=null;

function setBand(kind,text){view.band=text?{kind:kind,text:text}:null;paintBand();}
function paintBand(){
  ['band','scan-band'].forEach(function(id){
    var el=document.getElementById(id);if(!el)return;
    if(!view.band){el.hidden=true;el.textContent='';return;}
    el.hidden=false;el.className='band '+view.band.kind;el.textContent=view.band.text;
  });
}
function render(){
  var primary=document.getElementById('primary'),lot=view.lot;
  var counting=view.cur&&view.cur.items&&!view.cur.saved;
  var shooting=!!view.photo;
  var label='ラベルを読む',action='scan',enabled=workerValid&&!!lot;
  if(counting){
    if(allCounted(view.cur.items,view.cur.counts)){label='数を保存';action='count';enabled=!view.busy;}
    else{label='数を選んでください';action='none';enabled=false;}
  }else if(shooting){
    var n=view.photo.shots.length;
    if(n===0){label='写真を撮る';action='shoot';enabled=!view.busy;}
    else if(view.photo.loading){label='写真を読み込んでいます';action='none';enabled=false;}
    else{label='写真を送る（'+n+'枚）';action='send-photo';enabled=!view.busy;}
  }else if(pendingLoad().length){
    label='確認に進む（'+pendingLoad().length+'件）';action='resume';enabled=workerValid&&!view.sending;
  }
  primary.textContent=label;primary.dataset.action=action;primary.disabled=!enabled;
  var total=document.getElementById('total');
  if(!workerValid)total.textContent='';
  else if(!view.loaded)total.textContent='';
  else if(!lot)total.innerHTML='<span>今日確認する荷物はまだ登録されていません</span>';
  else total.innerHTML='届いた<b>'+fmt(view.arrived)+' / '+fmt(view.total)+'</b>';
  document.getElementById('closed-line').hidden=!(lot&&lot.status==='closed');
  var html='';
  if(counting){
    view.cur.items.forEach(function(it,i){
      html+='<div class="item"><div class="nm">'+esc(it.name)+'</div><div class="want">リスト '+esc(it.quantity)+' 個</div>';
      if(view.cur.other&&view.cur.other[it.key]){
        var cn=view.cur.counts[it.key];
        html+='<div class="step"><button type="button" data-item="'+i+'" data-step="-10" aria-label="10 減らす">−10</button><button type="button" data-item="'+i+'" data-step="-1" aria-label="1 減らす">−1</button><div class="big">'+cn+'</div><button type="button" data-item="'+i+'" data-step="1" aria-label="1 増やす">+1</button><button type="button" data-item="'+i+'" data-step="10" aria-label="10 増やす">+10</button></div>';
        html+='<button type="button" class="text-link step-back" data-item="'+i+'" data-other="0">ボタンから選ぶ</button></div>';
        return;
      }
      html+='<div class="nums">';
      countOptions(it.quantity).forEach(function(n){
        var cls=(n===Number(it.quantity)?'listq':'')+(view.cur.counts[it.key]===n?' on':'');
        html+='<button type="button" class="'+cls+'" data-item="'+i+'" data-n="'+n+'">'+n+'</button>';
      });
      html+='<button type="button" class="other" data-item="'+i+'" data-other="1">ほかの数</button>';
      html+='</div></div>';
    });
  }
  document.getElementById('items').innerHTML=html;
  var shots=document.getElementById('shots');
  if(shooting&&view.photo.shots.length){
    shots.hidden=false;
    shots.innerHTML=view.photo.shots.map(function(s,i){return '<img src="'+s.url+'" alt="写真 '+(i+1)+'">';}).join('')+(view.photo.shots.length<MAX_SHOTS?'<button class="menu-btn" type="button" id="more-shot" style="width:auto;flex:1"'+(view.busy?' disabled':'')+'>もう1枚撮る</button>':'');
  }else{shots.hidden=true;shots.innerHTML='';}
  document.getElementById('manual-go').disabled=isBusy(view);
  document.getElementById('issue-btn').disabled=!(view.last&&view.last.client_id)||!workerValid||view.busy||view.sending;
  var closeBtn=document.getElementById('close-btn');closeBtn.hidden=!view.canClose;
  closeBtn.disabled=!workerValid||!lot||lot.status==='closed';
  paintBand();
}

// 読み取り1回ごとに client_id を作り、再送しても同じ値を使う
async function doArrive(code){
  var body={action:'arrive',w:worker,client_id:makeUuid(),code:code};
  view.last={client_id:body.client_id,code:code};
  view.cur=null;view.photo=null;view.sending=true;render();
  try{return await doArriveSend(body);}finally{view.sending=false;render();}
}
async function doArriveSend(body){
  var value;
  try{value=await sendOrQueue(body);}
  catch(error){
    if(error.status===409){view.lot=null;setBand('error','今日確認する荷物はまだ登録されていません');render();return {keep:true};}
    if(error.status===429){setBand('error','続けて読みすぎです。少し待ってからもう一度読んでください');render();return {keep:true};}
    if(error.status===403){setBand('error',BAD_URL);render();updateStatus();return {keep:false};}
    setBand('error','読み取れませんでした。もう一度読んでください');render();return {keep:true};
  }
  if(!value){setBand('ok','受け付けました。電波が戻ると確認します');render();updateStatus();return {keep:true};}
  var rv=resultView(value.result,!!value.need_count);
  setBand(rv.kind,rv.text);
  // 数える・写真を撮る確認は、閉じたり読み込み直したりしても残るよう先に保存する
  var follow=pendingFromReply(body,value);if(follow)pendingSave(addPending(pendingLoad(),follow));
  if(rv.kind==='count'&&Array.isArray(value.items)&&value.items.length)view.cur={client_id:body.client_id,items:value.items,counts:{},saved:false};
  else if(rv.kind==='count'){setBand('ok','OK 次の荷物へ');rv={keep:true};}
  if(rv.kind==='photo')view.photo={client_id:body.client_id,issue:value.result==='issue',shots:[]};
  if(value.result==='arrived')view.arrived=Math.min(view.total||Infinity,view.arrived+1);
  render();updateStatus();
  return {keep:rv.keep};
}
async function onScanned(raw){
  var code=normArrive(raw);if(!code)return true;
  if(isBusy(view))return true;
  var now=Date.now();
  if(_lastRead.code===code&&now-_lastRead.at<5000)return true;
  _lastRead={code:code,at:now};
  var r=await doArrive(code);
  if(!r.keep){closeScan();refreshStatus();}
  return r.keep;
}
async function saveCount(){
  var cur=view.cur;if(!cur||view.busy||!allCounted(cur.items,cur.counts))return;
  view.busy=true;render();
  var body={action:'arrive_count',w:worker,client_id:cur.client_id,counts:cur.items.map(function(it){return {key:it.key,n:cur.counts[it.key]};})};
  try{await sendOrQueue(body);pendingDone(cur.client_id,'count');cur.saved=true;view.cur=null;setBand('ok','数を保存しました。次の荷物へ');}
  catch(error){setBand('error',error.status===403?BAD_URL:'保存できませんでした。もう一度押してください');}
  view.busy=false;render();updateStatus();refreshStatus();
}
function loadImageFile(file){return new Promise(function(resolve,reject){var url=URL.createObjectURL(file),image=new Image();image.onload=function(){URL.revokeObjectURL(url);resolve(image);};image.onerror=function(error){URL.revokeObjectURL(url);reject(error);};image.src=url;});}
function toJpeg(image,max,quality){var scale=Math.min(1,max/Math.max(image.width,image.height)),width=Math.max(1,Math.round(image.width*scale)),height=Math.max(1,Math.round(image.height*scale)),canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;canvas.getContext('2d').drawImage(image,0,0,width,height);return canvas.toDataURL('image/jpeg',quality);}
async function addShot(file){
  // 送信中は足さない。送ったあとに消えてしまうため
  if(!file||!view.photo||view.photo.sending||view.busy||view.photo.shots.length>=MAX_SHOTS)return;
  var target=view.photo;target.loading=(target.loading||0)+1;render();
  try{var image=await loadImageFile(file);if(view.photo!==target)return;var data=toJpeg(image,1600,.8);target.shots.push({url:data,base64:data.split(',')[1]});}
  catch(error){setBand('error','写真を読み込めませんでした。もう一度撮ってください');}
  finally{target.loading--;}
  render();
}
async function sendPhoto(){
  var p=view.photo;if(!p||!p.shots.length||p.loading||view.busy)return;
  view.busy=true;p.sending=true;render();
  var body={action:'arrive_photo',w:worker,client_id:p.client_id,photos:p.shots.map(function(s){return {media_type:'image/jpeg',base64:s.base64};})};
  if(p.issue)body.issue=true;
  try{await sendOrQueue(body);pendingDone(p.client_id,'photo');if(view.photo===p)view.photo=null;setBand('ok','写真を送りました。次の荷物へ');}
  catch(error){
    if(error.message==='photo_limit'){pendingDone(p.client_id,'photo');if(view.photo===p)view.photo=null;setBand('ok','この荷物の写真はもう十分あります。次の荷物へ');}
    else setBand('error',error.status===403?BAD_URL:'送れませんでした。もう一度押してください');
  }
  p.sending=false;view.busy=false;render();updateStatus();refreshStatus();
}
function resumePending(){
  if(isBusy(view))return;
  var rec=pendingLoad()[0];if(!rec)return;
  var code=rec.code||'';
  view.last={client_id:rec.client_id,code:code};
  if(rec.kind==='count'){view.cur={client_id:rec.client_id,items:rec.items,counts:{},saved:false};setBand('count',withCode('開けて数を数えてください',code));}
  else{view.photo={client_id:rec.client_id,issue:!!rec.issue,shots:[]};setBand('photo',withCode(rec.issue?'要確認です。写真を撮ってください':'リストにありません。写真を撮ってください',code));}
  render();
}
function startIssue(){
  if(!view.last||!view.last.client_id||view.busy||view.sending)return;
  document.getElementById('more').open=false;
  // 読み込み直しても続きから撮れるよう、写真の確認を先に保存する（同じ荷物の写真待ちは置き換える）
  pendingSave(addPending(pendingLoad(),{kind:'photo',client_id:view.last.client_id,issue:true,code:view.last.code||''}));
  view.cur=null;view.photo={client_id:view.last.client_id,issue:true,shots:[]};
  setBand('photo','破れ・中身が違う荷物の写真を撮ってください');render();
}
async function closeLot(){
  document.getElementById('more').open=false;
  if(!window.confirm('この回の確認を終えます。よろしいですか？'))return;
  try{var v=await request({action:'arrive_close',w:worker});setBand('ok',v&&v.closed?'確認を終えました':'確認を終える処理を受け付けました');}
  catch(error){setBand('error',error.status===403?(error.message==='close_forbidden'?'この URL では確認を終えられません。管理者に伝えてください':BAD_URL):'終えられませんでした。電波を確かめてもう一度お試しください');}
  await refreshStatus();
}

function stopScan(){
  if(!_cam)return;var cam=_cam;_cam=null;clearTimeout(cam.timer);
  if(cam.stream)cam.stream.getTracks().forEach(function(track){try{track.stop();}catch(error){}});
  cam.video.srcObject=null;document.getElementById('scan-tools').hidden=true;
}
function closeScan(){_scanSession++;stopScan();document.getElementById('scan-layer').hidden=true;}
function showManual(message){
  _scanSession++;stopScan();document.getElementById('reader-wrap').hidden=true;document.getElementById('scan-tip').hidden=true;document.getElementById('scan-shot').hidden=true;
  document.querySelector('#scan-layer h2').textContent='ラベルの番号を入力';
  document.getElementById('manual-form').hidden=false;document.getElementById('manual-open').hidden=true;
  document.getElementById('manual-error').textContent=message||'';
}
function getDetector(){
  if(_detectorP)return _detectorP;
  _detectorP=(async function(){
    var Native=window.BarcodeDetector;
    if(Native){try{var supported=await Native.getSupportedFormats();if(SCAN_FORMATS.every(function(f){return supported.indexOf(f)>=0;}))return new Native({formats:SCAN_FORMATS});}catch(error){}}
    var api=window.BarcodeDetectionAPI;if(!api)throw new Error('no_detector');
    try{await api.prepareZXingModule({overrides:{locateFile:function(path,prefix){return /\.wasm$/.test(path)?'vendor/zxing/'+api.ZXING_WASM_VERSION+'/'+path:prefix+path;}},fireImmediately:true});}
    catch(error){try{api.purgeZXingModule();}catch(error2){}throw error;}
    return new api.BarcodeDetector({formats:SCAN_FORMATS});
  })().catch(function(error){_detectorP=null;throw error;});
  return _detectorP;
}
function enhanceForScan(cx,w,h){
  try{var img=cx.getImageData(0,0,w,h),d=img.data,min=255,max=0,i,g;
    for(i=0;i<d.length;i+=4){g=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000;d[i]=d[i+1]=d[i+2]=g;if(g<min)min=g;if(g>max)max=g;}
    if(max-min>8){var k=255/(max-min);for(i=0;i<d.length;i+=4){g=Math.max(0,Math.min(255,(d[i]-min)*k));d[i]=d[i+1]=d[i+2]=g;}}
    cx.putImageData(img,0,0);}catch(error){}
}
async function decodeStill(file){
  var detector=await getDetector(),image=await loadImageFile(file),cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  var readText=async function(){try{var found=await detector.detect(cv);var hit=found.find(function(c){return typeof c.rawValue==='string'&&c.rawValue.trim();});return hit?hit.rawValue:'';}catch(error){return '';}};
  var rois=[[1,1],[0.9,0.4],[0.55,0.55],[0.7,0.25],[0.4,0.4]];
  for(var i=0;i<rois.length;i++){
    var rw=Math.round(image.width*rois[i][0]),rh=Math.round(image.height*rois[i][1]),rx=Math.round((image.width-rw)/2),ry=Math.round((image.height-rh)/2),sc=Math.min(2,2200/Math.max(rw,rh));
    cv.width=Math.max(2,Math.round(rw*sc));cv.height=Math.max(2,Math.round(rh*sc));cx.drawImage(image,rx,ry,rw,rh,0,0,cv.width,cv.height);
    var t1=await readText();if(t1)return t1;
    enhanceForScan(cx,cv.width,cv.height);
    var t2=await readText();if(t2)return t2;
  }
  return '';
}
function guideBox(vw,vh,cw,ch){
  var scale=Math.max(cw/vw,ch/vh),ox=(vw*scale-cw)/2,oy=(vh*scale-ch)/2;
  var gx=cw*0.02,gy=ch*0.27,gw=cw*0.96,gh=ch*0.46;
  return {x:(gx+ox)/scale,y:(gy+oy)/scale,w:gw/scale,h:gh/scale};
}
function inGuide(hit,box){
  var b=hit&&hit.boundingBox;if(!b||!box)return true;
  var cx=b.x+b.width/2,cy=b.y+b.height/2;
  return cx>=box.x&&cx<=box.x+box.w&&cy>=box.y&&cy<=box.y+box.h;
}
// 同じ値を2回続けて読めたら確定する（誤読を防ぐ）
function confirmRead(last,raw){
  var text=String(raw==null?'':raw).trim();
  if(!text)return {last:last,text:''};
  if(last.text!==text)return {last:{text:text,count:1},text:''};
  if(last.count+1<2)return {last:{text:text,count:last.count+1},text:''};
  return {last:{text:'',count:0},text:text};
}
function scanTick(){
  var cam=_cam;if(!cam)return;var video=cam.video;
  if(video.readyState<2||isBusy(view)){cam.timer=setTimeout(scanTick,200);return;}
  cam.detector.detect(video).then(function(found){
    if(_cam!==cam)return;
    var box=video.videoWidth&&video.clientWidth?guideBox(video.videoWidth,video.videoHeight,video.clientWidth,video.clientHeight):null;
    var hit=(found||[]).find(function(c){return typeof c.rawValue==='string'&&c.rawValue.trim()&&inGuide(c,box);});
    if(hit){
      var next=confirmRead(cam.last,hit.rawValue);cam.last=next.last;
      if(next.text){
        try{if(navigator.vibrate)navigator.vibrate(60);}catch(error){}
        onScanned(next.text).then(function(keep){if(_cam===cam&&keep){cam.last={text:'',count:0};cam.timer=setTimeout(scanTick,900);}},function(){if(_cam===cam)cam.timer=setTimeout(scanTick,900);});
        return;
      }
    }
    cam.timer=setTimeout(scanTick,200);
  },function(){if(_cam===cam)cam.timer=setTimeout(scanTick,200);});
}
function setupCameraTools(track,cam){
  var tools=document.getElementById('scan-tools'),torch=document.getElementById('scan-torch'),zoom=document.getElementById('scan-zoom');
  tools.hidden=true;torch.hidden=true;zoom.hidden=true;torch.classList.remove('on');
  try{
    var caps=track.getCapabilities?track.getCapabilities():{};
    if(caps.torch){torch.hidden=false;tools.hidden=false;cam.torch=false;}
    if(caps.zoom){var cur=track.getSettings?track.getSettings().zoom:null;zoom.min=caps.zoom.min;zoom.max=caps.zoom.max;zoom.step=caps.zoom.step||0.1;zoom.value=typeof cur==='number'?cur:caps.zoom.min;zoom.hidden=false;tools.hidden=false;}
  }catch(error){}
}
async function openScan(){
  document.getElementById('scan-layer').hidden=false;document.getElementById('reader-wrap').hidden=false;document.getElementById('scan-tip').hidden=false;document.getElementById('scan-shot').hidden=false;
  document.querySelector('#scan-layer h2').textContent='ラベルを枠に入れてください';
  document.getElementById('scan-tip').textContent='明るい場所で、ラベル全体を枠に入れてください';
  document.getElementById('manual-form').hidden=true;document.getElementById('manual-open').hidden=false;document.getElementById('manual-no').value='';document.getElementById('manual-error').textContent='';
  setBand('','');
  var video=document.getElementById('scan-video'),cam={video:video,stream:null,timer:0,detector:null,track:null,last:{text:'',count:0}};
  stopScan();_cam=cam;_scanSession++;
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('no camera');
    var detectorP=getDetector();detectorP.catch(function(){});
    var stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
    if(_cam!==cam){stream.getTracks().forEach(function(track){track.stop();});return;}
    cam.stream=stream;cam.track=stream.getVideoTracks()[0];video.srcObject=stream;
    try{await video.play();}catch(error){}
    setupCameraTools(cam.track,cam);
    try{cam.detector=await detectorP;}catch(error){if(_cam===cam)showManual('読み取りの準備ができませんでした。電波を確かめるか、ラベルの番号を入力してください。');return;}
    if(_cam===cam)cam.timer=setTimeout(scanTick,200);
  }catch(error){
    if(_cam!==cam)return;
    showManual('カメラを起動できません。ラベルの番号を入力してください。');
  }
}
function showIntro(){if(safeStorageGet('zigzag_arrive_intro','')==='1')return;document.getElementById('intro').hidden=false;}

document.getElementById('primary').addEventListener('click',function(){
  var a=this.dataset.action;
  if(a==='scan')openScan();
  else if(a==='count')saveCount();
  else if(a==='shoot')document.getElementById('photo-input').click();
  else if(a==='send-photo')sendPhoto();
  else if(a==='resume')resumePending();
});
document.getElementById('items').addEventListener('click',function(event){
  var b=event.target.closest('button[data-item]');if(!b||!view.cur||view.busy)return;
  var it=view.cur.items[Number(b.dataset.item)];if(!it)return;
  if(b.dataset.other!==undefined){
    view.cur.other=view.cur.other||{};view.cur.other[it.key]=b.dataset.other==='1';
    if(b.dataset.other==='1'&&typeof view.cur.counts[it.key]!=='number')view.cur.counts[it.key]=Math.max(0,Math.min(999,Math.floor(Number(it.quantity)||0)));
    render();return;
  }
  if(b.dataset.step!==undefined){view.cur.counts[it.key]=stepCount(view.cur.counts[it.key],b.dataset.step);render();return;}
  view.cur.counts[it.key]=Number(b.dataset.n);render();
});
document.getElementById('shots').addEventListener('click',function(event){if(event.target.id==='more-shot'&&!view.busy)document.getElementById('photo-input').click();});
document.getElementById('photo-input').addEventListener('change',function(){var file=this.files&&this.files[0];this.value='';addShot(file);});
document.getElementById('issue-btn').addEventListener('click',startIssue);
document.getElementById('close-btn').addEventListener('click',closeLot);
document.getElementById('intro-close').addEventListener('click',function(){safeStorageSet('zigzag_arrive_intro','1');document.getElementById('intro').hidden=true;});
document.getElementById('scan-close').addEventListener('click',function(){closeScan();refreshStatus();});
document.getElementById('manual-open').addEventListener('click',function(){showManual('');document.getElementById('manual-no').focus();});
document.getElementById('manual-form').addEventListener('submit',async function(event){
  event.preventDefault();if(isBusy(view))return;var input=document.getElementById('manual-no'),code=normArrive(input.value);
  if(!code){document.getElementById('manual-error').textContent='ラベルの番号を入力してください';return;}
  input.blur();input.value='';
  var r=await doArrive(code);
  if(r.keep)document.getElementById('manual-error').textContent='';
  else{closeScan();refreshStatus();}
});
document.getElementById('scan-shot').addEventListener('click',function(){document.getElementById('scan-shot-input').click();});
document.getElementById('scan-shot-input').addEventListener('change',async function(){
  var file=this.files&&this.files[0];this.value='';if(!file)return;
  var tip=document.getElementById('scan-tip'),button=document.getElementById('scan-shot'),session=_scanSession;button.disabled=true;tip.textContent='写真から番号を読んでいます';
  try{
    var text=await decodeStill(file);
    if(session!==_scanSession)return;
    if(text){tip.textContent='明るい場所で、ラベル全体を枠に入れてください';await onScanned(text);return;}
    tip.textContent='読み取れませんでした。ラベルを画面いっぱいに写して撮り直すか、番号を入力してください';
  }
  catch(error){if(session===_scanSession)tip.textContent='読み取れませんでした。番号を入力してください';}
  finally{button.disabled=false;}
});
document.getElementById('scan-torch').addEventListener('click',async function(){var cam=_cam;if(!cam||!cam.track)return;try{await cam.track.applyConstraints({advanced:[{torch:!cam.torch}]});cam.torch=!cam.torch;this.classList.toggle('on',cam.torch);}catch(error){}});
document.getElementById('scan-zoom').addEventListener('input',async function(){var cam=_cam;if(!cam||!cam.track)return;try{await cam.track.applyConstraints({advanced:[{zoom:parseFloat(this.value)}]});}catch(error){}});
window.addEventListener('online',flushQueue);
document.addEventListener('visibilitychange',function(){if(!document.hidden){flushQueue();refreshStatus();}});
showIntro();render();updateStatus();refreshStatus().then(flushQueue);
</script>
</body>

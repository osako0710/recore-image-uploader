<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>商品撮影（番号入力）</title>
<style>
:root{--bg:#f4f3ef;--card:#fff;--line:#ddd8ce;--text:#24231f;--sub:#6d6a62;--main:#1f4f8b;--main-dark:#163a66;--soft:#e8eef7;--warn:#9a5c00;--danger:#b12b26}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
.status{position:sticky;top:0;z-index:20;width:100%;min-height:46px;padding:12px 14px;background:#1f3450;color:#fff;text-align:center;font-size:14px;font-weight:700;padding-top:calc(12px + env(safe-area-inset-top))}
.status.warn{background:#765019}.status.bad{background:#8a2925}
main{width:100%;max-width:560px;margin:0 auto;padding:12px}
.intro{margin-bottom:12px;padding:12px 14px;border:1px solid #c9d4e3;border-radius:14px;background:#f1f5fa;font-size:14px}
.intro p{margin:2px 0}
.card{margin-bottom:12px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 2px 10px rgba(42,38,29,.04)}
.card h1,.card h2{margin:0;overflow-wrap:anywhere}
.card h1{font-size:23px;line-height:1.35}.card h2{font-size:17px}
.hint{margin:6px 0 0;color:var(--sub);font-size:13px}
.step{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:var(--sub);font-size:13px;font-weight:700}
.step span{display:grid;width:27px;height:27px;place-items:center;border-radius:50%;background:var(--soft);color:var(--main)}
.code-input{display:block;width:100%;margin-top:8px;padding:14px 12px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:34px;font-weight:800;letter-spacing:.12em;text-align:center;font-variant-numeric:tabular-nums}
.code-input:focus{outline:none;border-color:var(--main)}
.code-view{margin:4px 0 0;font-size:34px;font-weight:900;letter-spacing:.12em;color:var(--main);font-variant-numeric:tabular-nums}
.code-note{margin:8px 0 0;padding:10px 12px;border-radius:10px;background:#fff4e5;color:#7a4b00;font-size:14px;font-weight:700}
.photo-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.photo-row::-webkit-scrollbar{display:none}
.thumb{position:relative;flex:0 0 92px;height:92px;border-radius:12px;overflow:hidden;background:#ece9e2}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;right:4px;width:32px;height:32px;border:0;border-radius:50%;background:rgba(0,0,0,.72);color:#fff;font-size:20px;line-height:1}
.name-label{display:block;font-size:13px;color:var(--sub);margin-top:4px}.name-edit{width:100%;box-sizing:border-box;font-size:19px;font-weight:700;line-height:1.4;padding:8px;border:1px solid var(--line);border-radius:8px;resize:vertical;background:var(--card);color:var(--text)}
.text-link{display:inline-flex;min-height:44px;align-items:center;border:0;background:none;padding:4px 0;color:var(--main);text-decoration:underline;font-size:14px}
.loading{margin:10px 0;color:var(--sub);font-size:14px}
.choices{display:grid;gap:8px;margin-top:12px}
.choice{width:100%;min-height:54px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;overflow-wrap:anywhere}
.choice .done{display:block;margin-top:4px;font-size:13px;font-weight:400;color:#8a5a00}
.choice.on{border:2px solid var(--main);background:var(--soft);font-weight:700}
.condition{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.condition button{min-height:50px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;padding:10px 12px}
.condition button.on{border:2px solid var(--main);background:var(--soft);font-weight:700}
.quantity{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.counter{display:flex;align-items:center;gap:14px}.counter button{width:48px;height:48px;border:1px solid var(--line);border-radius:50%;background:#fff;font-size:24px}.counter output{min-width:28px;text-align:center;font-size:21px;font-weight:700}
details{margin-top:16px;border-top:1px solid var(--line);padding-top:8px}summary{min-height:44px;padding:11px 0;color:var(--main);font-weight:700;cursor:pointer}
label{display:block;margin:12px 0 4px;font-size:13px;font-weight:700;color:var(--sub)}
input[type=text],textarea{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
textarea{min-height:90px;resize:vertical}.count{text-align:right;color:var(--sub);font-size:12px}
.primary-wrap{position:fixed;right:0;bottom:0;left:0;z-index:15;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(244,243,239,.96) 18%,var(--bg) 38%)}
.primary{display:block;width:100%;max-width:536px;min-height:60px;margin:0 auto;border:0;border-radius:14px;background:var(--main);color:#fff;font-size:18px;font-weight:800;box-shadow:0 5px 16px rgba(31,79,139,.22)}
.primary:active{background:var(--main-dark)}.primary:disabled{background:#a5aaa6;box-shadow:none}
.receipt{text-align:center;padding:28px 16px}.management{margin:16px 0 4px;color:var(--main);font-size:42px;font-weight:900;letter-spacing:.08em;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.receipt p{margin:0;font-weight:700}
.error{margin:10px 0 0;color:var(--danger);font-size:14px;font-weight:700}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:500px){.condition{grid-template-columns:1fr 1fr 1fr}.condition button{text-align:center}}
</style>
</head>
<body>
<div id="status" class="status" role="status" aria-live="polite">準備しています</div>
<main>
  <section id="intro" class="intro" hidden>
    <p>1. 袋のラベルの8桁の数字を入力します</p>
    <p>2. 正面と、裏かタグを撮ります</p>
    <p>3. 商品と状態を選んで登録します</p>
  </section>
  <div id="app"></div>
</main>
<div class="primary-wrap"><button id="primary" class="primary" type="button">この番号で進む</button></div>
<input id="photo-input" class="sr-only" type="file" accept="image/*" capture="environment">
<script>
'use strict';
var API='https://pqfsanwopptslgdrdebn.supabase.co/functions/v1/fromjapan-shoot';
var MAX_PHOTOS=8;
var DB_NAME='fromjapan_shoot_v1';
var DB_STORE='pending';
var _codeSeq=0; var _draftSeq=0;
var _flushing=false;
var _candidatesReady=Promise.resolve();
var state=newState();
var params=new URLSearchParams(location.search);
var worker=params.get('w')||'';
var mock=isMockMode(location.search);
var workerValid=mock||/^[A-Za-z0-9]{8}$/.test(worker);

function newState(){return {stage:'code',codeInput:'',code:'',registered:null,photos:[],candidates:[],visibleCandidates:[],selected:null,selectedSet:false,condition:'',quantity:1,draft:{name:'',description:'',genre:''},size:'',memo:'',draftBusy:false,draftDone:false,draftCandidate:null,nameEdited:false,aiUnavailable:false,autoPicked:false,error:'',managementNo:'',clientId:''};}
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function normCode(raw){
  var s=String(raw==null?'':raw);if(s.normalize)s=s.normalize('NFKC');
  s=s.replace(/[\s\-‐‑‒–—―ー]/g,'');
  return /^\d{8}$/.test(s)?s:'';
}
function codeDigits(raw){var s=String(raw==null?'':raw);if(s.normalize)s=s.normalize('NFKC');return s.replace(/\D/g,'').slice(0,8);}
function formatCode(code){return code.length>4?code.slice(0,4)+' '+code.slice(4):code;}
function isMockMode(search){return new URLSearchParams(search).get('mock')==='1';}
function photoRule(count){return {enough:count>=2,full:count>=8,remaining:Math.max(0,8-count)};}
function primaryState(value){
  if(value.stage==='receipt')return {action:'next',label:'次の商品へ',enabled:true};
  if(value.stage==='code')return {action:'code',label:'この番号で進む',enabled:value.workerValid!==false&&!!value.codeReady};
  if(value.photos<2)return {action:'photo',label:'写真を撮る（あと'+(2-value.photos)+'枚）',enabled:true};
  if(!value.ready&&value.waiting)return {action:'save',label:value.waiting,enabled:false};
  return {action:'save',label:'登録して次へ',enabled:!!value.ready};
}
function publicText(value){
  return String(value||'')
    .replace(/(?:価格|仕入値?|販売価格)/g,'')
    .replace(/[¥￥]\s*[\d,]+|[\d,]+\s*円/g,'')
    .replace(/\s{2,}/g,' ').trim();
}
function orderedCandidates(candidates,topIds,max){var ids=Array.isArray(topIds)?topIds:[];var picked=ids.map(function(id){return candidates.find(function(item){return item.candidate_id===id;});}).filter(Boolean);var picked2=picked.filter(function(item,i){return picked.indexOf(item)===i;});if(!picked2.length)return candidates.slice(0,max);return picked2.slice(0,max);}
function doneText(item){var done=Number(item&&item.done)||0,left=Number(item&&item.remaining)||0;if(done<=0)return '';if(left>0&&done>=left)return '残数ぶん登録済み';return '登録済み '+done+'点';}
function dedupeQueue(items){
  var seen={},out=[];
  items.forEach(function(item){if(!item||!item.client_id)return;if(seen[item.client_id]===undefined){seen[item.client_id]=out.length;out.push(item);}else out[seen[item.client_id]]=item;});
  return out;
}
async function flushQueueList(items,send){
  var queue=dedupeQueue(items),remaining=[];
  for(var i=0;i<queue.length;i++){
    try{await send(queue[i]);}catch(error){if(error&&error.status&&error.status<500){continue;}remaining=remaining.concat(queue.slice(i));break;}
  }
  return remaining;
}
function makeUuid(){
  if(crypto.randomUUID)return crypto.randomUUID();
  var bytes=new Uint8Array(16);crypto.getRandomValues(bytes);bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;
  return Array.from(bytes,function(b){return b.toString(16).padStart(2,'0');}).join('').replace(/^(........)(....)(....)(....)/,'$1-$2-$3-$4-');
}
function safeStorageGet(key,fallback){try{var value=localStorage.getItem(key);return value===null?fallback:value;}catch(error){return fallback;}}
function safeStorageSet(key,value){try{localStorage.setItem(key,value);}catch(error){}}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayCount(){var raw=safeStorageGet('fromjapan_shoot_today','');try{var value=JSON.parse(raw);return value&&value.date===todayKey()?Number(value.count)||0:0;}catch(error){return 0;}}
function addToday(){var next=todayCount()+1;safeStorageSet('fromjapan_shoot_today',JSON.stringify({date:todayKey(),count:next}));return next;}
function showIntro(){if(safeStorageGet('fromjapan_shoot_intro','')==='1')return;document.getElementById('intro').hidden=false;safeStorageSet('fromjapan_shoot_intro','1');}

function mockCandidates(){return [
  {candidate_id:'11111111-1111-4111-8111-111111111111',name:'ネイビーのショルダーバッグ',remaining:1}
];}
async function request(path,options){
  if(mock){
    await new Promise(function(resolve){setTimeout(resolve,180);});
    if(!options){var q=new URLSearchParams(path.replace(/^\?/,''));var code=q.get('code')||'';return {code:code,candidates:code==='00000000'?[]:mockCandidates(),registered:code==='99999999'?{management_no:code,created_at:'2026-10-29T00:00:00Z'}:null};}
    var body=JSON.parse(options.body||'{}');
    if(body.action==='draft'){
      if(params.get('ai')==='0'){var unavailable=new Error('ai_unavailable');unavailable.status=503;throw unavailable;}
      if(body.candidate_id||body.prev_name){var picked=mockCandidates().find(function(item){return item.candidate_id===body.candidate_id;});return {name:(picked?picked.name:'ネイビー ショルダーバッグ')+' 作り直し',description:'作り直した説明です。',genre:'バッグ',candidate_id:body.candidate_id||null,confidence:body.candidate_id?1:.5,top_ids:[]};}
      return {name:'ネイビーのショルダーバッグ',description:'落ち着いた色のバッグです。写真の状態をご確認ください。',genre:'バッグ',candidate_id:mockCandidates()[0].candidate_id,confidence:.94,top_ids:[]};
    }
    if(body.action==='save'){if(body.code==='99999999'){var dup=new Error('number_registered');dup.status=409;throw dup;}return {ok:true,management_no:body.code,photo_urls:[]};}
  }
  var response=await fetch(API+path,options);
  var value={};try{value=await response.json();}catch(error){}
  if(!response.ok){var requestError=new Error(value.error||'request_failed');requestError.status=response.status;throw requestError;}
  return value;
}
function openQueue(){
  return new Promise(function(resolve,reject){
    var call=indexedDB.open(DB_NAME,1);
    call.onupgradeneeded=function(){var db=call.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE,{keyPath:'client_id'});};
    call.onsuccess=function(){resolve(call.result);};call.onerror=function(){reject(call.error);};
  });
}
async function queuePut(body){var db=await openQueue();await new Promise(function(resolve,reject){var tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(body);tx.oncomplete=resolve;tx.onerror=function(){reject(tx.error);};});db.close();}
async function queueAll(){var db=await openQueue();var rows=await new Promise(function(resolve,reject){var call=db.transaction(DB_STORE).objectStore(DB_STORE).getAll();call.onsuccess=function(){resolve(call.result||[]);};call.onerror=function(){reject(call.error);};});db.close();return dedupeQueue(rows);}
async function queueDelete(id){var db=await openQueue();await new Promise(function(resolve,reject){var tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=function(){reject(tx.error);};});db.close();}
async function queueCount(){try{return (await queueAll()).length;}catch(error){return 0;}}
async function flushQueue(){
  if(_flushing||navigator.onLine===false||!workerValid)return;
  _flushing=true;
  try{
    var rows=await queueAll();
    await flushQueueList(rows,async function(body){
      try{var result=await request('',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});}
      catch(error){if(error&&error.status&&error.status<500){await queueDelete(body.client_id);}throw error;}
      await queueDelete(body.client_id);
      if(state.stage==='receipt'&&state.clientId===body.client_id){state.managementNo=result.management_no||'';render();}
    });
  }catch(error){}finally{_flushing=false;await updateStatus();}
}
async function updateStatus(){
  var status=document.getElementById('status');
  if(!workerValid){status.className='status bad';status.textContent='この URL は使えません。担当者に連絡してください';return;}
  var pending=await queueCount();
  if(pending){status.className='status warn';status.textContent='未送信 '+pending+'件 ・ つながったら自動で送ります';return;}
  status.className='status';status.textContent='今日 '+todayCount()+'件登録 ・ 保存済み ✓';
}
function resetItem(){_draftSeq++;_codeSeq++;state=newState();render();focusCode();}
function readyToSave(){return state.photos.length>=2&&state.draftDone&&!state.draftBusy&&state.selectedSet&&!!state.condition&&!state.registered;}
function waitingText(){if(state.registered)return 'この番号は登録済みです';if(state.draftBusy||!state.draftDone)return '商品名を確認しています';if(!state.selectedSet)return '商品を選んでください';if(!state.condition)return '商品の状態を選んでください';return '';}
function primaryInfo(){return primaryState({stage:state.stage,photos:state.photos.length,ready:readyToSave(),waiting:waitingText(),workerValid:workerValid,codeReady:!!normCode(state.codeInput)});}
function candidateHtml(){
  if(!state.draftDone||!state.candidates.length)return '';
  var title=state.aiUnavailable?'商品を選んでください':'写真に合う商品を選んでください';
  var rows=state.visibleCandidates.map(function(item){var name=publicText(item.name)||'商品名を確認できません';return '<button class="choice'+(state.selectedSet&&state.selected===item.candidate_id?' on':'')+'" type="button" data-candidate="'+esc(item.candidate_id)+'">'+esc(name)+(doneText(item)?'<span class="done">'+esc(doneText(item))+'</span>':'')+'</button>';}).join('');
  rows+='<button class="choice'+(state.selectedSet&&state.selected===null?' on':'')+'" type="button" data-candidate="none">どれでもない</button>';
  var note=state.autoPicked?'<p class="hint">写真から自動で選びました。違うときは正しい商品を押してください。</p>':'';
  return '<section class="card"><div class="step"><span>3</span>'+esc(title)+'</div>'+note+'<div class="choices">'+rows+'</div></section>';
}
function focusCode(){var input=document.getElementById('code-input');if(input)input.focus();}
function render(){
  var app=document.getElementById('app'),html='';
  if(state.stage==='receipt'){
    var no=state.managementNo||'未送信';
    html='<section class="card receipt"><h1>登録を受け付けました</h1><div class="management">'+esc(state.managementNo?formatCode(no):no)+'</div><p>'+(state.managementNo?'ラベルの番号のまま管理します':'つながると登録が終わります')+'</p></section>';
  }else{
    html+='<section class="card"><div class="step"><span>1</span>袋のラベルの番号</div>';
    if(state.stage==='code'){
      html+='<h2>「(検)」の右の8桁の数字を入力してください</h2>';
      html+='<input id="code-input" class="code-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="9" placeholder="0000 0000" aria-label="ラベルの8桁の数字" value="'+esc(formatCode(state.codeInput))+'">';
      if(state.error)html+='<p class="error">'+esc(state.error)+'</p>';
    }else{
      html+='<div class="code-view">'+esc(formatCode(state.code))+'</div>';
      if(state.registered)html+='<p class="code-note">この番号は登録済みです。番号を確かめてください。</p>';
      html+='<button class="text-link" type="button" data-action="recode"'+(state.draftBusy?' disabled':'')+'>番号を直す</button>';
    }
    html+='</section>';
    if(state.stage!=='code'){
      html+='<section class="card"><div class="step"><span>2</span>商品の写真</div>';
      if(state.draftDone&&state.photos.length>=2)html+='<label class="name-label" for="edit-name">商品名</label><textarea id="edit-name" class="name-edit" rows="2" maxlength="500"'+(state.draftBusy?' disabled':'')+'>'+esc(state.draft.name)+'</textarea>'+(state.aiUnavailable?'':'<button class="text-link" type="button" data-action="regen-name"'+(state.draftBusy?' disabled':'')+'>商品名を作り直す</button>');
      else html+='<h1>'+esc(state.draft.name||'正面と、裏かタグを撮ってください')+'</h1>';
      html+='<p class="hint">'+(state.photos.length<2?'あと'+(2-state.photos.length)+'枚撮ってください。':'撮れました。8枚まで足せます。')+'</p><div class="photo-row">';
      state.photos.forEach(function(photo,index){html+='<div class="thumb"><img src="'+photo.url+'" alt="写真 '+(index+1)+'"><button type="button" data-remove="'+index+'" aria-label="写真 '+(index+1)+' を削除">×</button></div>';});
      html+='</div>';
      if(state.photos.length>=2&&state.photos.length<MAX_PHOTOS)html+='<button class="text-link" type="button" data-action="add-photo">写真を追加</button>';
      if(state.draftBusy)html+='<p class="loading">'+(state.draftDone?'商品名を作り直しています。':'商品名を確認しています。状態は先に選べます。')+'</p>';
      if(state.error)html+='<p class="error">'+esc(state.error)+'</p>';
      var cands=candidateHtml();html+='</section>'+cands;
      if(state.photos.length>=2){
      html+='<section class="card"><div class="step"><span>'+(cands?4:3)+'</span>商品の状態</div><div class="condition">';
      [['new','新品・未使用'],['good','目立った傷なし'],['damaged','傷や汚れあり']].forEach(function(item){html+='<button type="button" class="'+(state.condition===item[0]?'on':'')+'" data-condition="'+item[0]+'">'+item[1]+'</button>';});
      html+='</div><div class="quantity"><strong>数量</strong><div class="counter"><button type="button" data-quantity="-1" aria-label="数量を減らす">−</button><output>'+state.quantity+'</output><button type="button" data-quantity="1" aria-label="数量を増やす">＋</button></div></div>';
      html+='<details><summary>⋯ 詳しく</summary><label for="edit-description">説明</label><textarea id="edit-description" maxlength="1000">'+esc(state.draft.description)+'</textarea><label for="edit-size">サイズ</label><input id="edit-size" type="text" maxlength="100" value="'+esc(state.size)+'"><label for="edit-memo">メモ</label><textarea id="edit-memo" maxlength="500">'+esc(state.memo)+'</textarea><div id="memo-count" class="count">'+state.memo.length+' / 500</div></details></section>';
      }
    }
  }
  app.innerHTML=html;
  var info=primaryInfo(),primary=document.getElementById('primary');primary.textContent=info.label;primary.disabled=!info.enabled;primary.dataset.action=info.action;
}
function clearDraft(){_draftSeq++;state.draftBusy=false;state.draftDone=false;state.draftCandidate=null;state.visibleCandidates=[];state.selected=null;state.selectedSet=false;state.autoPicked=false;state.aiUnavailable=false;state.nameEdited=false;state.draft={name:'',description:'',genre:''};}
function recode(){if(state.draftBusy)return;_codeSeq++;clearDraft();state.stage='code';state.codeInput=state.code;state.code='';state.registered=null;state.candidates=[];state.error='';_candidatesReady=Promise.resolve();render();focusCode();}
function submitCode(){
  var code=normCode(state.codeInput);
  if(!code){state.error='8桁の数字を入力してください';render();focusCode();return;}
  loadCode(code);
}
async function loadCode(code){
  var seq=++_codeSeq;
  state.stage='photos';state.code=code;state.registered=null;state.error='';render();
  _candidatesReady=request('?w='+encodeURIComponent(worker)+'&code='+encodeURIComponent(code));
  try{var value=await _candidatesReady;if(seq!==_codeSeq)return;state.candidates=Array.isArray(value.candidates)?value.candidates:[];state.registered=value.registered||null;}
  catch(error){if(seq!==_codeSeq)return;state.candidates=[];state.error=error.status===403?'この URL は使えません。担当者に連絡してください':'商品の情報を読み込めませんでした。写真から登録を続けられます。';if(error.status===403)workerValid=false;}
  if(state.photos.length>=2&&!state.draftBusy&&!state.draftDone)createDraft();
  render();updateStatus();
}
function loadImageFile(file){return new Promise(function(resolve,reject){var url=URL.createObjectURL(file),image=new Image();image.onload=function(){URL.revokeObjectURL(url);resolve(image);};image.onerror=function(error){URL.revokeObjectURL(url);reject(error);};image.src=url;});}
function toJpeg(image,max,quality){var scale=Math.min(1,max/Math.max(image.width,image.height)),width=Math.max(1,Math.round(image.width*scale)),height=Math.max(1,Math.round(image.height*scale)),canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;canvas.getContext('2d').drawImage(image,0,0,width,height);return canvas.toDataURL('image/jpeg',quality);}
async function addPhoto(file){
  if(!file||state.photos.length>=MAX_PHOTOS)return;
  try{var image=await loadImageFile(file),data=toJpeg(image,1600,.8);state.photos.push({url:data,base64:data.split(',')[1],media_type:'image/jpeg'});state.error='';render();if(state.photos.length===2&&!state.draftDone&&!state.draftBusy)createDraft();}
  catch(error){state.error='写真を読み込めませんでした。もう一度撮ってください。';render();}
}
async function createDraft(opts){
  opts=opts||{};var redo=!!opts.redo;var seq=++_draftSeq;
  state.draftBusy=true;state.error='';render();
  try{
    try{await _candidatesReady;}catch(candidateError){}
    if(seq!==_draftSeq)return;
    var value=await request('',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(draftRequestBody(opts))});
    if(seq!==_draftSeq)return;
    state.draft={name:publicText(value.name),description:publicText(value.description),genre:publicText(value.genre)};state.nameEdited=false;state.draftCandidate=value.candidate_id||null;
    if(redo){state.draftBusy=false;if(shouldRedoForPick(state.selected)){createDraft({redo:true});return;}render();return;}
    var chosen=state.candidates.find(function(item){return item.candidate_id===value.candidate_id;});
    state.visibleCandidates=orderedCandidates(state.candidates,value.top_ids,3);
    if(chosen&&!state.visibleCandidates.some(function(item){return item.candidate_id===chosen.candidate_id;}))state.visibleCandidates[Math.min(state.visibleCandidates.length,2)]=chosen;
    if(chosen&&Number(value.confidence)>=.8){state.selected=chosen.candidate_id;state.selectedSet=true;state.autoPicked=true;}
  }catch(error){
    if(seq!==_draftSeq)return;
    if(redo){state.draftBusy=false;state.error='商品名を作り直せませんでした。商品名の欄で直してください。';render();return;}
    state.draft={name:'',description:'',genre:''};state.aiUnavailable=error.status===503;state.visibleCandidates=state.aiUnavailable?state.candidates.slice():state.candidates.slice(0,3);
    state.error=state.aiUnavailable?'商品名の自動作成を使えません。商品名を入力して登録を続けてください。':'商品名を作れませんでした。商品名を入力して登録を続けてください。';
  }
  state.draftBusy=false;state.draftDone=true;if(!state.candidates.length){state.selected=null;state.selectedSet=true;}render();
}
function draftRequestBody(opts){
  var body={action:'draft',w:worker,code:state.code,photos:state.photos.slice(0,3).map(function(photo){return {media_type:'image/jpeg',base64:photo.base64};})};
  if(opts&&opts.redo){if(state.selectedSet&&state.selected)body.candidate_id=state.selected;if(opts.prevName)body.prev_name=String(opts.prevName).slice(0,500);}
  return body;
}
function shouldRedoForPick(id){return !!id&&state.draftDone&&!state.draftBusy&&!state.aiUnavailable&&!state.nameEdited&&state.photos.length>=2&&id!==state.draftCandidate;}
function currentDetails(){return {name:(document.getElementById('edit-name')||{}).value||state.draft.name,description:(document.getElementById('edit-description')||{}).value||state.draft.description,size:(document.getElementById('edit-size')||{}).value||state.size,memo:(document.getElementById('edit-memo')||{}).value||state.memo};}
function saveBody(){
  var details=currentDetails(),description=details.description;if(details.size)description+=(description?'\n':'')+'サイズ: '+details.size;
  state.draft={name:details.name,description:details.description,genre:state.draft.genre};state.size=details.size;state.memo=details.memo;state.clientId=state.clientId||makeUuid();
  return {action:'save',w:worker,code:state.code,client_id:state.clientId,candidate_id:state.selected,condition:state.condition,quantity:state.quantity,photos:state.photos.map(function(photo){return {media_type:'image/jpeg',base64:photo.base64};}),draft:{name:details.name,description:description,genre:state.draft.genre},memo:details.memo.slice(0,500)};
}
function saveErrorText(error){
  if(error.status===403)return 'この URL は使えません。担当者に連絡してください';
  if(error.status===409&&error.message==='number_registered')return 'この番号は登録済みです。番号を確かめてください。';
  if(error.message==='number_in_progress')return 'この番号はほかの端末で登録中です。少し待ってからもう一度押してください。';
  if(error.status===429)return '登録が多すぎます。しばらく待ってからもう一度押してください。';
  return '登録内容を確認できませんでした。もう一度お試しください。';
}
async function saveItem(){
  if(!readyToSave())return;
  var primary=document.getElementById('primary');primary.disabled=true;primary.textContent='登録しています';state.error='';
  var body=saveBody();
  try{
    if(navigator.onLine===false)throw new Error('offline');
    var result=await request('',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});state.managementNo=result.management_no||'';
  }catch(error){
    if((error.status&&error.status<500)||error.message==='number_in_progress'){state.error=saveErrorText(error);if(error.status===403)workerValid=false;if(error.message==='number_registered')state.registered={management_no:state.code};render();updateStatus();return;}
    try{await queuePut(body);state.managementNo='';}catch(queueError){state.error='端末に保存できませんでした。空き容量を確認して、もう一度押してください。';render();return;}
  }
  addToday();state.stage='receipt';render();updateStatus();
}
document.getElementById('primary').addEventListener('click',function(){var action=this.dataset.action;if(action==='code')submitCode();else if(action==='photo')document.getElementById('photo-input').click();else if(action==='save')saveItem();else if(action==='next')resetItem();});
document.getElementById('photo-input').addEventListener('change',function(){var file=this.files&&this.files[0];this.value='';addPhoto(file);});
document.getElementById('app').addEventListener('click',function(event){
  var target=event.target.closest('button');if(!target)return;
  if(target.dataset.action==='recode'){recode();return;}
  if(target.dataset.action==='add-photo'){document.getElementById('photo-input').click();return;}
  if(target.dataset.remove!==undefined){var index=Number(target.dataset.remove);state.photos.splice(index,1);if(state.photos.length<2){_draftSeq++;state.draftBusy=false;state.draftDone=false;state.visibleCandidates=[];state.selected=null;state.selectedSet=false;}render();return;}
  if(target.dataset.action==='regen-name'){if(!state.draftBusy)createDraft({redo:true,prevName:state.draft.name});return;}
  if(target.dataset.candidate!==undefined){state.autoPicked=false;state.selected=target.dataset.candidate==='none'?null:target.dataset.candidate;state.selectedSet=true;if(shouldRedoForPick(state.selected))createDraft({redo:true});else render();return;}
  if(target.dataset.condition){state.condition=target.dataset.condition;render();return;}
  if(target.dataset.quantity){state.quantity=Math.max(1,Math.min(999,state.quantity+Number(target.dataset.quantity)));render();}
});
document.getElementById('app').addEventListener('input',function(event){
  if(event.target.id==='code-input'){
    var digits=codeDigits(event.target.value);state.codeInput=digits;state.error='';
    var shown=formatCode(digits);if(event.target.value!==shown){event.target.value=shown;}
    var primary=document.getElementById('primary');primary.disabled=!normCode(digits)||!workerValid;
    var err=document.querySelector('#app .error');if(err)err.remove();
    return;
  }
  if(event.target.id==='edit-name'){state.draft.name=event.target.value;state.nameEdited=true;}
  else if(event.target.id==='edit-description')state.draft.description=event.target.value;
  else if(event.target.id==='edit-size')state.size=event.target.value;
  else if(event.target.id==='edit-memo'){state.memo=event.target.value;var count=document.getElementById('memo-count');if(count)count.textContent=event.target.value.length+' / 500';}
});
document.getElementById('app').addEventListener('keydown',function(event){if(event.target.id==='code-input'&&event.key==='Enter'){event.preventDefault();submitCode();}});
window.addEventListener('online',flushQueue);
showIntro();render();updateStatus().then(flushQueue);focusCode();
</script>
</body>
